<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d1424">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Threads">
<title>Threads</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icon-180.png">
<link rel="icon" type="image/png" href="/icon-192.png">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.2/Sortable.min.js"></script>
<style>
:root{
  --night:#0d1424; --night-2:#141d31;
  --ink:#eef2f8; --ink-2:#aab3c5; --ink-3:#6f7a91;
  --line:rgba(255,255,255,.09); --glass:rgba(255,255,255,.055);
  --sheet:rgba(21,30,51,.9); --bar:rgba(22,31,52,.72);
  --hi:rgba(255,255,255,.12); --field:rgba(255,255,255,.07); --shadow:rgba(3,6,15,.32);
  --dawn:#f2c46d; --dawn-ink:#1d1606; --danger:#ff6b61; --ok:#3ecf8e;
  --sky:rgba(90,165,255,.20); --sky2:rgba(120,200,255,.10);
  --r-lg:22px; --r-md:16px; --r-sm:12px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{min-height:100%}
body{font:16px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",system-ui,sans-serif;color:var(--ink);
  background:linear-gradient(180deg,var(--night),var(--night-2)) fixed;background-color:var(--night);
  -webkit-font-smoothing:antialiased;transition:background .6s,color .6s}
body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:-1;
  background:radial-gradient(120% 60% at 15% -10%,var(--sky),transparent 60%),radial-gradient(90% 50% at 100% 0%,var(--sky2),transparent 60%)}
button,input,select,textarea{font:inherit;color:inherit;background:none;border:0;outline:0}
button{cursor:pointer}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--dawn);outline-offset:2px}
[hidden]{display:none!important}
.glass{background:var(--card,var(--glass));border:1px solid var(--line2,var(--line));
  -webkit-backdrop-filter:blur(22px) saturate(1.4);backdrop-filter:blur(22px) saturate(1.4);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 12px 32px var(--shadow)}
.muted{color:var(--ink-3);font-size:14px}
svg{display:block}

/* shell */
.app{max-width:680px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 14px) 16px calc(env(safe-area-inset-bottom) + 48px)}
.top{display:flex;align-items:center;gap:8px;margin-bottom:14px;min-height:46px}
.top h1{font-size:30px;font-weight:750;letter-spacing:-.02em;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.icon-btn{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;color:var(--ink-2);position:relative;flex:none}
.icon-btn svg{width:22px;height:22px}
.icon-btn .badge{position:absolute;top:-2px;right:-4px;z-index:1;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--hi);color:var(--ink-2);font-size:11px;font-weight:650;display:grid;place-items:center}
.add-btn{height:42px;padding:0 16px 0 12px;border-radius:999px;background:var(--dawn);color:var(--dawn-ink);font-weight:650;display:flex;align-items:center;gap:6px;box-shadow:0 8px 22px var(--shadow);flex:none}
.add-btn svg{width:20px;height:20px}

.filter{display:flex;align-items:center;gap:10px;height:46px;padding:0 8px 0 14px;border-radius:var(--r-md);margin-bottom:16px}
.filter svg{width:18px;height:18px;color:var(--ink-3);flex:none}
.filter input{flex:1;min-width:0;height:100%;font-size:16px}
.filter input::placeholder{color:var(--ink-3)}
.filter .clear{width:32px;height:32px;border-radius:50%;color:var(--ink-3);font-size:20px;line-height:1}
body.v-detail .filter{display:none}

.banner{display:flex;align-items:center;gap:10px;padding:12px 12px 12px 16px;border-radius:var(--r-md);margin-bottom:16px;border-color:var(--dawn)}
.banner b{flex:1;font-weight:600;font-size:15px}
.banner .add-btn{height:36px;padding:0 14px}
.banner .x{width:32px;height:32px;color:var(--ink-3);font-size:20px}

/* pinned row */
.pins{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 14px;margin:0 -2px 6px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.pins::-webkit-scrollbar{display:none}
.pin{flex:none;max-width:280px;display:flex;align-items:center;gap:8px;height:46px;padding:0 16px 0 8px;border-radius:999px;font-weight:600;font-size:15px;
  -webkit-touch-callout:none;user-select:none;-webkit-user-select:none}
.pin span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pin .kic{width:30px;height:30px}
.pin-g{font-style:normal;color:var(--ink-3);font-weight:600}


/* groups */
.secs,.subs{display:grid;gap:14px;grid-template-columns:minmax(0,1fr)}
.subs{gap:10px;padding:4px 10px 6px 14px}
.subs:empty{display:none}
.sec{--c:var(--ink-3);border-radius:var(--r-lg);padding:4px 0 8px}
.sec.sub{background:var(--field);border:1px solid var(--line);border-radius:var(--r-md);box-shadow:none;padding:2px 0 6px}
.sec-h{display:flex;align-items:center;gap:10px;padding:6px 6px 4px 4px}
.grip{width:24px;margin-right:-4px;height:40px;display:grid;place-items:center;color:var(--ink-3);touch-action:none;cursor:grab;flex:none}
.grip svg{width:18px;height:18px}
.gicon{width:34px;height:34px;min-width:34px;border-radius:11px;display:grid;place-items:center;font-size:18px;line-height:1;overflow:hidden;flex:none;
  background:color-mix(in srgb,var(--c) 22%,transparent);color:var(--c)}
.gicon svg{width:18px;height:18px}
.sub .gicon{width:28px;height:28px;border-radius:9px;font-size:15px}
.sec-name{flex:1;min-width:0;display:flex;align-items:center;gap:8px;height:40px;text-align:left;font-size:18px;font-weight:700;padding-left:0}
.sub .sec-name{font-size:16px;font-weight:650}
.sec-name span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sec-name small{font-size:12px;font-weight:700;color:var(--ink-2);background:var(--hi);border-radius:999px;padding:2px 8px;flex:none}
.sec-name .chev{width:16px;height:16px;color:var(--ink-3);transition:transform .25s;flex:none}
.sec.closed > .sec-h .chev{transform:rotate(-90deg)}
.sec.closed > .chat-list,.sec.closed > .subs{display:none}
.more,.proj-btn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:var(--ink-3);flex:none}
.more svg,.proj-btn svg{width:20px;height:20px}
.proj-btn{color:var(--c)}

/* item cards */
.chat-list{display:grid;gap:8px;padding:4px 10px 6px;min-height:8px}
.chat-list.bare:empty{min-height:54px;margin:2px 10px 6px;padding:0;border:1.5px dashed var(--line);border-radius:var(--r-sm)}
.chat-list.bare:empty::before{content:'Drag items here';display:grid;place-items:center;height:50px;color:var(--ink-3);font-size:14px}
.chat{--c:var(--dawn);display:flex;align-items:stretch;border-radius:14px;overflow:hidden;
  background:linear-gradient(90deg,color-mix(in srgb,var(--c) 14%,transparent),var(--field) 55%);
  border:1px solid color-mix(in srgb,var(--c) 30%,var(--line));
  box-shadow:inset 3px 0 0 var(--c),0 4px 14px var(--shadow);
  -webkit-touch-callout:none;user-select:none;-webkit-user-select:none;transition:transform .15s}
.chat:active{transform:scale(.985)}
.chat-main{flex:1;min-width:0;display:flex;align-items:center;gap:12px;min-height:60px;padding:9px 6px 9px 14px;text-align:left}
.kic{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;flex:none;
  background:color-mix(in srgb,var(--c) 22%,transparent);color:var(--c)}
.kic svg{width:18px;height:18px}
.txt{min-width:0;flex:1}
.txt b{display:block;font-weight:620;font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.txt small{display:block;color:var(--ink-3);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:1px}
.txt small em{font-style:normal;color:var(--ink-2)}
.pinmark{width:7px;height:7px;border-radius:50%;background:var(--dawn);display:inline-block;margin-left:6px;vertical-align:middle}
.go{width:52px;display:grid;place-items:center;flex:none;color:var(--c);border-left:1px solid var(--line)}
.go span{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:color-mix(in srgb,var(--c) 20%,transparent)}
.go svg{width:18px;height:18px}
.go.none{color:var(--ink-3)}
.go.none span{background:var(--field)}
.new-sec{width:100%;height:50px;margin-top:14px;border-radius:var(--r-lg);border:1.5px dashed var(--line);color:var(--ink-2);font-weight:600}

/* drag feedback */
.s-ghost{opacity:.3}
.sortable-fallback{opacity:1!important;border-radius:14px;box-shadow:0 18px 40px var(--shadow)!important;scale:1.03;transition:scale .2s,opacity .2s}
body.hot-archive .sortable-fallback{scale:.55;opacity:.55!important}
/* card grip, same feel as groups */
.chat .grip{width:28px;height:auto;align-self:stretch;margin-left:3px}
.chat .chat-main{padding-left:2px}
/* archive dock */
.dock{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 22px);z-index:65;display:flex;align-items:center;gap:12px;
  padding:12px 22px 12px 14px;border-radius:999px;background:var(--sheet);border:1px solid var(--line);
  -webkit-backdrop-filter:blur(24px);backdrop-filter:blur(24px);box-shadow:0 16px 40px var(--shadow);
  transform:translate(-50%,160%);opacity:0;pointer-events:none;font-weight:650;white-space:nowrap;
  transition:transform .4s cubic-bezier(.34,1.4,.5,1),opacity .25s,background .2s,border-color .2s}
body.dragging .dock,body.archiving .dock{transform:translate(-50%,0);opacity:1}
.dock.hot{transform:translate(-50%,0) scale(1.14);background:color-mix(in srgb,var(--dawn) 26%,var(--sheet));border-color:var(--dawn)}
.bin{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--hi);color:var(--dawn)}
.bin svg{width:26px;height:26px;overflow:visible}
.bin .lid{transform-box:fill-box;transform-origin:0% 100%;transition:transform .35s cubic-bezier(.34,1.8,.5,1)}
.dock.hot .lid{transform:rotate(-32deg) translate(-1px,-3px)}
.dock .t2{display:none}
.dock.hot .t1{display:none}.dock.hot .t2{display:inline}
.dock.gulp .bin{animation:gulp .6s cubic-bezier(.34,1.6,.5,1)}
@keyframes gulp{0%{transform:scale(1)}25%{transform:scale(.72) rotate(-6deg)}60%{transform:scale(1.18) rotate(4deg)}100%{transform:scale(1)}}
.tab.bump svg,.icon-btn.bump svg{animation:bump .6s cubic-bezier(.34,1.6,.5,1)}
.icon-btn.bump .badge{animation:pop .5s .15s both}
@keyframes bump{0%{transform:none}30%{transform:translateY(3px) scale(.85)}65%{transform:translateY(-3px) scale(1.12)}100%{transform:none}}
@keyframes pop{0%{transform:scale(.4)}70%{transform:scale(1.25)}100%{transform:scale(1)}}
.arch-h{font-size:13px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-3);margin:6px 4px 8px}
.arch-row .gicon{--c:var(--ink-3)}
body.dragging{user-select:none;-webkit-user-select:none}
.drop-hint{position:fixed;inset:12px;border:2px dashed var(--dawn);border-radius:28px;display:grid;place-items:center;z-index:70;
  background:color-mix(in srgb,var(--night) 70%,transparent);font-size:20px;font-weight:650;pointer-events:none}

/* flat lists */
.flat{border-radius:var(--r-lg);padding:10px;display:grid;gap:8px}
.arch-row{display:flex;align-items:center;gap:6px;padding:8px 4px 8px 10px}
.arch-row + .arch-row{box-shadow:inset 0 1px 0 var(--line)}
.arch-row > button:first-child{flex:1;min-width:0;text-align:left}
.arch-row b{display:block;font-weight:560;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pill-btn{height:34px;padding:0 12px;border-radius:999px;background:var(--field);font-size:14px;font-weight:600;color:var(--ink);flex:none}
.pill-btn.warn{color:var(--danger)}
.empty{border-radius:var(--r-lg);padding:26px 22px;text-align:center;display:grid;gap:12px;justify-items:center}
.empty h2{font-size:19px}
.empty p{color:var(--ink-2);max-width:34ch}

/* detail page */
.hero{--c:var(--dawn);border-radius:var(--r-lg);padding:18px;margin-bottom:14px;position:relative;overflow:hidden}
.hero::before{content:'';position:absolute;inset:0;background:radial-gradient(90% 80% at 0% 0%,color-mix(in srgb,var(--c) 22%,transparent),transparent 70%);pointer-events:none}
.hero > *{position:relative}
.crumbs{display:flex;align-items:center;gap:8px;flex-wrap:wrap;color:var(--ink-2);font-size:13px;font-weight:600;margin-bottom:10px}
.tag{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 10px;border-radius:999px;background:color-mix(in srgb,var(--c) 20%,transparent);color:var(--c)}
.tag svg{width:14px;height:14px}
.title-inp{width:100%;font-size:26px;font-weight:750;letter-spacing:-.02em;padding:4px 0;border-bottom:1px solid transparent}
.title-inp:focus{border-bottom-color:var(--line)}
.open-big{display:flex;align-items:center;justify-content:center;gap:10px;height:56px;border-radius:var(--r-md);background:var(--c);color:#111;font-weight:700;font-size:17px;margin-top:14px;box-shadow:0 10px 26px var(--shadow)}
.open-big svg{width:20px;height:20px}
.open-big.none{background:var(--field);color:var(--ink-2);box-shadow:none}
.hero-actions{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.card{border-radius:var(--r-lg);padding:16px;margin-bottom:14px}
.card-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.card-h h3{font-size:15px;font-weight:700;letter-spacing:.02em;text-transform:uppercase;color:var(--ink-2)}
.saved{font-size:12px;color:var(--ok);opacity:0;transition:opacity .3s}
.saved.on{opacity:1}
.todo{display:flex;align-items:center;gap:10px;min-height:44px}
.todo + .todo{box-shadow:inset 0 1px 0 var(--line)}
.tick{width:26px;height:26px;border-radius:50%;border:2px solid var(--ink-3);display:grid;place-items:center;flex:none;color:transparent}
.tick svg{width:14px;height:14px}
.todo.done .tick{background:var(--ok);border-color:var(--ok);color:#06220f}
.todo input{flex:1;min-width:0;height:42px;font-size:16px}
.todo.done input{color:var(--ink-3);text-decoration:line-through}
.todo .x{width:32px;height:32px;color:var(--ink-3);font-size:20px;flex:none}
.todo-new{display:flex;align-items:center;gap:10px;min-height:46px;box-shadow:inset 0 1px 0 var(--line)}
.todo-new .tick{border-style:dashed}
.todo-new input{flex:1;height:44px;font-size:16px}
.todo-new input::placeholder,.notes::placeholder{color:var(--ink-3)}
.notes{width:100%;min-height:140px;resize:none;font-size:16px;line-height:1.5;background:var(--field);border:1px solid var(--line);border-radius:var(--r-sm);padding:12px 14px}
.rows{display:grid}
.rowb{display:flex;align-items:center;gap:12px;min-height:52px;text-align:left;width:100%}
.rowb + .rowb,.rowb + .switch,.switch + .rowb{box-shadow:inset 0 1px 0 var(--line)}
.rowb span{flex:1;font-weight:560}
.rowb em{font-style:normal;color:var(--ink-2);max-width:55%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rowb.warn span{color:var(--danger)}
.meta{color:var(--ink-3);font-size:13px;text-align:center;margin-top:6px}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.4);opacity:0;pointer-events:none;transition:opacity .3s;z-index:40}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;max-width:680px;margin:0 auto;max-height:90vh;overflow:auto;z-index:41;
  padding:10px 20px calc(env(safe-area-inset-bottom) + 24px);border-radius:26px 26px 0 0;
  background:var(--sheet);-webkit-backdrop-filter:blur(26px) saturate(1.4);backdrop-filter:blur(26px) saturate(1.4);
  border:1px solid var(--line);border-bottom:0;
  transform:translateY(105%);transition:transform .42s cubic-bezier(.2,.9,.2,1.02)}
.sheet:not(.on){visibility:hidden;transition:transform .42s cubic-bezier(.2,.9,.2,1.02),visibility 0s .42s}
.sheet.on{transform:none}
.grab{width:40px;height:5px;border-radius:3px;background:var(--ink-3);margin:0 auto 14px;opacity:.6}
.sheet h2{font-size:22px;font-weight:720;letter-spacing:-.01em;margin-bottom:14px}
.field{display:grid;gap:6px;margin-bottom:16px}
.field > span{font-size:13px;color:var(--ink-3);font-weight:600}
.inp{width:100%;min-height:48px;padding:12px 14px;border-radius:var(--r-sm);background:var(--field);border:1px solid var(--line);font-size:16px}
.inp::placeholder{color:var(--ink-3)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{height:38px;padding:0 14px;border-radius:999px;background:var(--field);border:1px solid var(--line);color:var(--ink-2);font-weight:600;font-size:15px;display:inline-flex;align-items:center;gap:6px}
.chip svg{width:16px;height:16px}
.chip.on{background:var(--dawn);border-color:var(--dawn);color:var(--dawn-ink)}
.picker{display:grid;gap:4px;max-height:260px;overflow:auto;background:var(--field);border:1px solid var(--line);border-radius:var(--r-sm);padding:6px}
.pick{display:flex;align-items:center;gap:8px;min-height:42px;padding:0 10px;border-radius:10px;text-align:left;font-weight:560;color:var(--ink-2)}
.pick .gicon{width:26px;height:26px;border-radius:8px;font-size:14px}
.pick.on{background:var(--dawn);color:var(--dawn-ink)}
.pick.on .gicon{background:rgba(0,0,0,.12);color:inherit}
.swatches{display:flex;flex-wrap:wrap;gap:10px}
.sw{width:38px;height:38px;border-radius:50%;background:var(--c);border:3px solid transparent;box-shadow:0 0 0 1px var(--line)}
.sw.none{background:var(--field);display:grid;place-items:center;color:var(--ink-3);font-size:18px}
.sw.on{border-color:var(--ink)}
.emojis{display:grid;grid-template-columns:repeat(auto-fill,minmax(44px,1fr));gap:6px}
.emo{height:44px;border-radius:12px;background:var(--field);font-size:22px;border:2px solid transparent}
.emo.on{border-color:var(--dawn)}
.btn{width:100%;height:52px;border-radius:var(--r-md);background:var(--dawn);color:var(--dawn-ink);font-weight:680;font-size:16px;margin-top:6px;display:flex;align-items:center;justify-content:center;gap:8px}
.btn.ghost{background:var(--field);color:var(--ink)}
.btn.warn{background:var(--field);color:var(--danger)}
.btn:disabled{opacity:.5}
.btn + .btn{margin-top:10px}
.btn svg{width:20px;height:20px;flex:none}
.imp-list{max-height:300px;overflow:auto;background:var(--field);border:1px solid var(--line);border-radius:var(--r-sm);padding:10px 12px;margin:12px 0 4px}
.imp-list h4{font-size:13px;color:var(--ink-2);margin:8px 0 4px}
.imp-list h4:first-child{margin-top:0}
.imp-list div{font-size:15px;padding:3px 0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.imp-list .arch{color:var(--ink-3)}
.paste{height:76px;font-size:19px}
.paste svg{width:24px;height:24px}
.or{text-align:center;color:var(--ink-3);font-size:13px;margin:14px 0 10px}
.err{color:var(--danger);font-size:14px;margin:8px 2px 0;min-height:1em}
.linklike{display:block;margin:16px auto 0;color:var(--ink-2);font-weight:600;font-size:15px;text-decoration:underline;text-underline-offset:3px}
.switch{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:52px;font-weight:560}
.switch input{appearance:none;-webkit-appearance:none;width:50px;height:30px;border-radius:999px;background:var(--hi);position:relative;transition:background .2s;flex:none}
.switch input::after{content:'';position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:transform .25s cubic-bezier(.34,1.3,.5,1);box-shadow:0 2px 6px rgba(0,0,0,.25)}
.switch input:checked{background:var(--ok)}
.switch input:checked::after{transform:translateX(20px)}
.set{padding:4px 0 18px;border-bottom:1px solid var(--line);margin-bottom:18px}
.set h3{font-size:16px;font-weight:680;margin-bottom:4px}
.set .muted{margin-bottom:12px}
.theme-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.th{padding:12px 10px;border-radius:var(--r-md);border:1px solid var(--line);display:grid;gap:8px;justify-items:center;font-size:12px;color:var(--ink-2)}
.th .swt{width:100%;height:34px;border-radius:10px;position:relative;overflow:hidden}
.th .swt i{position:absolute;right:7px;top:7px;width:14px;height:14px;border-radius:50%}
.th.on{border-color:var(--dawn);color:var(--ink)}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);background:var(--field);border-radius:var(--r-sm);padding:4px;gap:4px}
.seg button{height:40px;border-radius:9px;font-size:14px;font-weight:600;color:var(--ink-2)}
.seg button.on{background:var(--hi);color:var(--ink)}
.dup{border-radius:var(--r-md);padding:16px;margin-bottom:14px}
.dup b{font-weight:650}

/* toast */
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 24px);transform:translate(-50%,16px);opacity:0;padding:11px 16px;border-radius:14px;
  background:var(--sheet);border:1px solid var(--line);font-size:15px;font-weight:560;z-index:60;transition:opacity .25s,transform .3s;pointer-events:none;max-width:88vw;text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}
.toast.bad{color:var(--danger)}

/* login */
.login{min-height:80vh;display:grid;place-items:center}
.login form{width:100%;max-width:360px;border-radius:26px;padding:28px 22px;display:grid;gap:12px;text-align:center}
.login h1{font-size:32px;font-weight:760;letter-spacing:-.02em}
.login p{color:var(--ink-2);margin-bottom:6px}

/* colors (last so they win) */
.pick{--c:var(--ink-3)}
.pin{--c:var(--dawn)}
.rowb svg{width:20px;height:20px;color:var(--ink-3);flex:none}
.emo svg{width:20px;height:20px}
.pick > svg{width:18px;height:18px;flex:none}
.c-gold{--c:#f2c46d}.c-coral{--c:#ff8a65}.c-rose{--c:#f48fb1}.c-violet{--c:#b39ddb}
.c-blue{--c:#64b5f6}.c-teal{--c:#4dd0e1}.c-green{--c:#81c784}.c-slate{--c:#90a4ae}

/* ---------- pages + project dashboard ---------- */
.tabs{display:flex;gap:6px;padding:4px;border-radius:999px;margin-bottom:14px;width:max-content;max-width:100%}
.tab{height:38px;padding:0 14px 0 11px;white-space:nowrap;border-radius:999px;display:flex;align-items:center;gap:8px;font-weight:650;font-size:15px;color:var(--ink-2)}
.tab svg{width:18px;height:18px}
.tab small{font-size:12px;font-weight:700;background:var(--hi);border-radius:999px;padding:1px 7px}
.tab.on{background:var(--hi);color:var(--ink)}
.tab.on svg{color:var(--dawn)}
.dash{display:grid;gap:12px;max-width:880px}
.dash .sec{padding-bottom:8px}
.dash .sec > .sec-h{padding-left:12px}
.dash .sec > .sec-h > .grip{display:none}
.phero{--c:var(--dawn);border-radius:var(--r-lg);padding:12px 12px 12px 14px;position:relative;overflow:hidden;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.phero::before{content:'';position:absolute;inset:0;background:radial-gradient(90% 120% at 0% 0%,color-mix(in srgb,var(--c) 20%,transparent),transparent 70%);pointer-events:none}
.phero > *{position:relative}
.phero > .gicon{width:42px;height:42px;border-radius:13px;font-size:22px}
.phero-t{flex:1;min-width:150px}
.phero-n{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.phero-n h2{font-size:21px;font-weight:750;letter-spacing:-.02em;line-height:1.2}
.phero-t small{display:block;color:var(--ink-3);font-size:12px;margin-top:2px}
.phero-a{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.pill-btn{display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.pill-btn svg{width:15px;height:15px;flex:none}
.pill-btn.accent{background:color-mix(in srgb,var(--c,var(--dawn)) 22%,transparent);color:var(--c,var(--dawn))}
.st{display:inline-flex;align-items:center;height:22px;padding:0 9px;border-radius:999px;font-size:12px;font-weight:700;letter-spacing:.01em}
.st-go{background:color-mix(in srgb,#64b5f6 22%,transparent);color:#8cc8f8}
.st-ok{background:color-mix(in srgb,#3ecf8e 22%,transparent);color:#5fe0a5}
.st-warn{background:color-mix(in srgb,#f2c46d 24%,transparent);color:#f2c46d}
.st-bad{background:color-mix(in srgb,#ff6b61 22%,transparent);color:#ff8a82}
.st-mute{background:var(--hi);color:var(--ink-2)}
.nn .nl{display:flex;gap:10px;align-items:baseline;font-size:15px;line-height:1.45;padding:3px 0}
.nn .nl b{flex:none;width:38px;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-3)}
.nn .nx{margin-top:6px;padding:8px 10px;border-radius:var(--r-sm);background:color-mix(in srgb,var(--dawn) 9%,transparent)}
.nn .nx b{color:var(--dawn)}
.clip{cursor:pointer}
.clip .full{display:none}
.clip.open .short{display:none}
.clip.open .full{display:inline}
.det{margin-top:8px;font-size:14px;color:var(--ink-2)}
.det summary{cursor:pointer;color:var(--ink-3);font-weight:600;font-size:13px;list-style:none;display:inline-flex;align-items:center;gap:6px}
.det summary::before{content:'▸';transition:transform .2s}
.det[open] summary::before{transform:rotate(90deg)}
.det summary::-webkit-details-marker{display:none}
.det ul{margin:6px 0 0 18px;display:grid;gap:3px}
.lchips{display:flex;flex-wrap:wrap;gap:8px}
.lchip{display:inline-flex;align-items:center;gap:7px;height:36px;padding:0 13px 0 11px;border-radius:999px;background:var(--glass);border:1px solid var(--line);font-size:14px;font-weight:600;max-width:100%}
.lchip svg{width:15px;height:15px;flex:none;color:var(--ink-2)}
.lchip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fill{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:12px 12px 12px 14px;border-radius:var(--r-md);border-style:dashed}
.fill-t{flex:1;min-width:180px}
.fill-t b{display:block;font-weight:680;font-size:15px}
.fill-t span{color:var(--ink-3);font-size:13px}
.fill-b{display:flex;gap:8px;flex-wrap:wrap}
.cfg .dcard .row{display:flex;align-items:center;gap:10px;min-height:48px;padding:6px 0}
.cfg .dcard .row + .row{box-shadow:inset 0 1px 0 var(--line)}
.row-t{flex:1;min-width:0}
.row-t b{display:block;font-weight:620;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row-t span{display:flex;align-items:center;gap:5px;color:var(--ink-3);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row-t span svg{width:13px;height:13px;flex:none;color:var(--dawn)}
.cfg .row > svg{width:16px;height:16px;color:var(--ink-3);flex:none}
.cfg .row .li{width:30px;height:30px;border-radius:9px;background:var(--field);display:grid;place-items:center;flex:none}
.cfg .row .li svg{width:15px;height:15px}
.cfg code{font:600 14px ui-monospace,SFMono-Regular,Menlo,monospace;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
.cfg .where{color:var(--ink-2);font-size:13px;flex:none}
.notes-ul{margin-left:18px;display:grid;gap:5px;line-height:1.45}
.hint-s{display:flex;align-items:center;gap:6px;color:var(--ink-3);font-size:12px;margin-top:8px}
.hint-s svg{width:12px;height:12px}
.cfg-foot{display:flex;justify-content:center;padding:4px 0 12px}
.step-tag{font-style:normal;display:inline-flex;align-items:center;gap:3px;margin-left:7px;padding:0 6px;height:18px;border-radius:999px;background:var(--hi);color:var(--ink-2);font-size:11px;font-weight:700;vertical-align:2px}
.step-tag svg{width:10px;height:10px}
.tools-all{display:grid;gap:10px}
.ta{padding:10px 12px;border-radius:var(--r-md);background:var(--field);border:1px solid var(--line)}
.ta-h{display:flex;align-items:center;gap:8px}
.ta-h b{flex:1;font-weight:650}
.ta-h small{font-size:12px;font-weight:700;background:var(--hi);border-radius:999px;padding:1px 8px;color:var(--ink-2)}
.ta-u{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.uchip{--c:var(--ink-3);height:28px;padding:0 10px;border-radius:999px;font-size:13px;font-weight:600;background:color-mix(in srgb,var(--c) 18%,transparent);color:var(--ink)}
.dcard{border-radius:var(--r-lg);padding:14px 16px}
.dcard-h{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.dcard-h h3{flex:1;font-size:13px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-2)}
.dcard-h .more{width:34px;height:34px}
.dcard-h .more svg{width:17px;height:17px}
.dcard p{color:var(--ink);line-height:1.5}
.next{margin-top:10px;display:flex;gap:8px;align-items:flex-start;padding:10px 12px;border-radius:var(--r-sm);background:color-mix(in srgb,var(--dawn) 16%,transparent);color:var(--ink);font-weight:560}
.next b{color:var(--dawn);font-weight:700;flex:none}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tags span{padding:5px 11px;border-radius:999px;background:var(--field);border:1px solid var(--line);font-size:14px;font-weight:560}
.acct{display:flex;align-items:center;gap:10px;min-height:44px}
.acct + .acct,.lnk + .lnk{box-shadow:inset 0 1px 0 var(--line)}
.acct b{flex:1;min-width:0;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.acct span{display:flex;align-items:center;gap:5px;color:var(--ink-2);font-size:13px;text-align:right}
.acct span svg{width:14px;height:14px;flex:none;color:var(--dawn)}
.lnk{display:flex;align-items:center;gap:10px;min-height:44px}
.lnk b{font-weight:600;flex:none}
.lnk span{flex:1;min-width:0;color:var(--ink-3);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lnk svg{width:16px;height:16px;color:var(--ink-3);flex:none}
.unk{color:var(--ink-3);font-weight:600;margin-bottom:10px}
.unk-btns{display:flex;flex-wrap:wrap;gap:8px}
.unk-btns .pill-btn{display:inline-flex;align-items:center;gap:6px}
.unk-btns svg{width:15px;height:15px}
.unk-btns a.pill-btn{color:var(--dawn)}
.allbar{display:flex;align-items:center;gap:10px;padding:10px 10px 10px 14px;border-radius:var(--r-md)}
.pill-btn svg{width:16px;height:16px;flex:none}
.park-btn,.allbar .pill-btn{display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
@media (max-width:360px){.top .add-btn{width:42px;padding:0;justify-content:center}.top .add-btn span{display:none}.top .icon-btn{width:38px}.top{gap:4px}}
@media (max-width:430px){.tab{padding:0 11px 0 9px;gap:6px;font-size:14px}.phero-a{width:100%}.phero-a .more{margin-left:auto}}
.allbar span{flex:1;font-weight:600;color:var(--ink-2)}
.sec-sum{padding:0 14px 8px 46px;color:var(--ink-3);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:-4px}
.mk-act{height:32px;padding:0 12px;border-radius:999px;background:color-mix(in srgb,var(--dawn) 20%,transparent);color:var(--dawn);font-size:13px;font-weight:700;flex:none;display:inline-flex;align-items:center;gap:5px}
.mk-act svg{width:14px;height:14px}
.mk-sm{width:34px;height:34px;padding:0;justify-content:center}
.mk-sm svg{width:17px;height:17px}
.home-tag{font-style:normal;font-size:11px;font-weight:700;color:var(--dawn);background:color-mix(in srgb,var(--dawn) 18%,transparent);border-radius:999px;padding:1px 7px;margin-left:6px;vertical-align:2px}
.pick-list{display:grid;gap:8px}
.pick-row{display:flex;align-items:center;gap:10px;padding:8px 8px 8px 10px;border-radius:var(--r-md);background:var(--field);border:1px solid var(--line)}
.pick-row b{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hint{color:var(--ink-3);font-size:13px;margin:-6px 2px 12px}
.upd{border-radius:var(--r-md);padding:12px 14px;margin-bottom:12px}
.upd h4{font-size:13px;color:var(--ink-2);margin:8px 0 4px}
.upd h4:first-child{margin-top:0}
.upd div{font-size:15px;padding:2px 0}

/* ---------- Mac / wide screens ---------- */
.panel{display:none}
@media (min-width: 900px){
  .app{max-width:none;padding:22px 32px 48px}
  .bar{display:flex;align-items:center;gap:10px;margin-bottom:18px}
  .bar .top{display:contents}
  .bar .top > *{order:2}
  .bar .top [data-act="main"]{order:-1}
  .bar .top h1{order:0;flex:none;margin-right:10px}
  .bar .filter{order:1;flex:1;max-width:560px;margin:0 auto 0 0}
  .pins{flex-wrap:wrap;overflow:visible;padding-bottom:16px}
  #secs{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));grid-auto-rows:4px;gap:0 16px;align-items:start}
  #secs > .sec{align-self:start}
  .new-sec{max-width:320px}

  body.has-panel .app{padding-right:calc(min(440px,40vw) + 48px)}
  .panel{display:block;position:fixed;top:16px;right:16px;bottom:16px;width:min(440px,40vw);overflow:auto;z-index:30;
    border-radius:26px;padding:10px 16px 24px;background:var(--sheet);border:1px solid var(--line);
    -webkit-backdrop-filter:blur(26px) saturate(1.4);backdrop-filter:blur(26px) saturate(1.4);box-shadow:0 20px 50px var(--shadow);
    animation:panelIn .32s cubic-bezier(.2,.9,.2,1)}
  .panel[hidden]{display:none}
  .panel .hero,.panel .card{box-shadow:none}
  .panel-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
  .panel-h span{font-size:13px;color:var(--ink-3);font-weight:600}
  .chat-main,.go,.sec-name,.pin{cursor:pointer}
}
@keyframes panelIn{from{transform:translateX(28px);opacity:0}}
@media (hover:hover){
  .chat{transition:transform .15s,border-color .2s,box-shadow .2s}
  .chat:hover{border-color:color-mix(in srgb,var(--c) 60%,var(--line));box-shadow:inset 3px 0 0 var(--c),0 8px 22px var(--shadow)}
  .go:hover span{background:color-mix(in srgb,var(--c) 34%,transparent)}
}
.chat.sel{border-color:var(--c);box-shadow:inset 3px 0 0 var(--c),0 0 0 2px color-mix(in srgb,var(--c) 45%,transparent)}

/* cards stand out from the background, tinted with their project color */
:root{--card:color-mix(in srgb,var(--ink) 8%,transparent);--line2:color-mix(in srgb,var(--ink) 13%,transparent)}
.glass{box-shadow:inset 0 1px 0 color-mix(in srgb,var(--ink) 10%,transparent),0 14px 34px var(--shadow)}
.sec.glass,.phero,.dcard,.ptile{background:linear-gradient(180deg,color-mix(in srgb,var(--c) 15%,var(--card)),color-mix(in srgb,var(--c) 6%,var(--card)));border-color:color-mix(in srgb,var(--c) 34%,var(--line2))}
.sec.glass:not([class*=" c-"]),.dcard:not([class*=" c-"]){--c:var(--ink-3)}
/* centered column on Mac for everything but Parked */
body.narrow #content{max-width:880px;margin:0 auto}
body.narrow .tabs{margin-left:auto;margin-right:auto}
.dash{max-width:none}
/* parked tiles */
.ptiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,270px),1fr));gap:12px}
.ptile{--c:var(--ink-3);border-radius:var(--r-lg);display:flex;flex-direction:row;align-items:stretch;-webkit-touch-callout:none;user-select:none;-webkit-user-select:none}
.ptile-main{flex:1;min-width:0;display:grid;grid-template-columns:auto 1fr;grid-template-rows:auto auto auto;column-gap:12px;row-gap:3px;padding:14px 4px 14px 14px;text-align:left;align-items:center;cursor:pointer}
.ptile-main .gicon{grid-row:1 / span 3;align-self:start;width:40px;height:40px;min-width:40px;border-radius:12px;font-size:20px}
.ptile-n{display:flex;align-items:center;gap:8px;min-width:0}
.ptile-n b{font-size:17px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ptile-l{font-size:14px;color:var(--ink-2);line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ptile-l em{font-style:normal;font-weight:700;color:var(--c);margin-right:2px}
.ptile-m{font-size:12px;color:var(--ink-3)}
.ptile-a{display:flex;flex-direction:column;align-items:flex-end;justify-content:space-between;gap:6px;padding:10px 10px 8px 0;flex:none}
.ptile-a .more{width:34px;height:34px}
.ptiles{gap:10px}
.ptile-a .mk-act{width:34px;height:34px;padding:0;justify-content:center}.ptile-a .mk-act span{display:none}
@media (hover:hover){.ptile{transition:transform .15s,border-color .2s}.ptile:hover{transform:translateY(-2px);border-color:color-mix(in srgb,var(--c) 60%,var(--line2))}}
/* park → swap sheet */
.swap-list .pick-row{width:100%;text-align:left;cursor:pointer}
.sw-t{flex:1;min-width:0;display:grid}
.sw-t b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sw-t small{color:var(--ink-3);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* inbox filing */
.dropbar{display:grid;gap:8px}
.drop-chips{display:flex;flex-wrap:wrap;gap:8px}
.drop-chip{--c:var(--ink-3);display:flex!important;align-items:center;min-height:38px!important;padding:0 14px!important;margin:0!important;border-radius:999px;border:1.5px dashed color-mix(in srgb,var(--c) 55%,var(--line2))!important;background:color-mix(in srgb,var(--c) 10%,transparent);font-weight:650;font-size:14px}
.drop-chip::before{display:none!important}
.drop-chip .chat{display:none}
.drop-chip:has(.chat){background:color-mix(in srgb,var(--c) 30%,transparent);border-style:solid!important}
@media (max-width:430px){.tab{padding:0 10px}.tab[data-act="archive"] span,.tab[data-v="inbox"] span{display:none}}

/* Title Case theme: no forced ALL CAPS on headers */
.dcard-h h3,.card-h h3,.arch-h{text-transform:none!important;letter-spacing:-.005em!important;font-size:15px!important;color:var(--ink)!important;font-weight:700!important}
.nn .nl b{text-transform:none!important;letter-spacing:0!important;font-size:13px!important}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="app" id="app"></div>
<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true"></div>
<div class="toast" id="toast" role="status"></div>
<div class="drop-hint" id="drop" hidden>Drop to add</div>
<aside class="panel" id="panel" hidden></aside>
<div class="dock" id="dock" aria-hidden="true"><span class="bin"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><g class="lid"><rect x="3" y="4" width="18" height="5" rx="1.5"/></g><path d="M5 9v9a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V9M10 13h4"/></svg></span><span class="t1">Drop here to archive</span><span class="t2">Let go to archive</span></div>
<script>
// ---------- icons ----------
const ICON = {
  plus: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>',

const SMALL = new Set('a an and as at but by for in nor of on or per the to vs via with'.split(' '));
function tc(t) {
  let first = true;
  return String(t ?? '').split(/(\s+)/).map((w) => {
    if (!w || /^\s+$/.test(w)) return w;
    const f = first; first = /[:–—]$/.test(w);
    if (/[A-Z]/.test(w) || /[.\/@]\w/.test(w) || /^\d/.test(w)) return w;
    const m = w.match(/^([^a-z]*)([a-z])(.*)$/s);
    if (!m) return w;
    if (!f && !m[1] && SMALL.has(w.replace(/[^a-z]/g, ''))) return w;
    return m[1] + m[2].toUpperCase() + m[3];
  }).join('');
}
const TC_SEL = 'h1,h2,h3,h4,.tab,.btn,.pill-btn,.mk-act,.add-btn,.chip,.field > span,.switch,.th,.seg button,.sec-name > span,.chat .txt b,.pin > span,.row-t b,.row-t span,.where,.lchip span,.uchip,.ta-h b,.pick,.fill-t b,.new-sec,.det summary,.arch-row b,.ptile-n b,.dc-label,.nl > b,.upd div,.banner b,.empty h2';
function tcTree(root) {
  const els = root.matches?.(TC_SEL) ? [root, ...root.querySelectorAll(TC_SEL)] : root.querySelectorAll?.(TC_SEL) || [];
  for (const el of els) {
    if (el.closest('input,textarea,code,.notes-ul')) continue;
    const w = document.createTreeWalker(el, NodeFilter.SHOW_TEXT);
    for (let n; (n = w.nextNode());) { const v = tc(n.data); if (v !== n.data) n.data = v; }

}

const UUID_RE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i;
const U = '[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}';
// Turns anything pasted into { kind, chat_uuid, url } or { error }.
function parseLink(text) {
  const t = String(text || '').trim().split(/\s+/)[0] || '';
  if (!t) return { error: 'Nothing to paste. Copy a link first.' };
  if (/claude\.ai\/share\//i.test(t)) return { error: "That's a share link, which is a public snapshot. Copy the chat's own link (claude.ai/chat/…) instead." };
  let m = t.match(new RegExp(`claude\\.ai/chat/(${U})`, 'i'));
  if (m) return { kind: 'chat', chat_uuid: m[1].toLowerCase(), url: null };
  if (UUID_RE.test(t)) return { kind: 'chat', chat_uuid: t.toLowerCase(), url: null };
  m = t.match(new RegExp(`claude\\.ai/project/(${U})`, 'i'));
  if (m) return { kind: 'project', chat_uuid: null, url: `https://claude.ai/project/${m[1].toLowerCase()}` };
  m = t.match(/^(?:https:\/\/claude\.ai|claude:\/\/(?:claude\.ai)?)\/?code\/([A-Za-z0-9_-]{6,})/i);
  if (m && m[1].toLowerCase() !== 'new') return { kind: 'code', chat_uuid: null, url: `https://claude.ai/code/${m[1]}` };
  if (/^(https:\/\/claude\.ai\/|claude:\/\/)/i.test(t)) {
    const url = t.replace(/^claude:\/\/claude\.ai\//i, 'https://claude.ai/').slice(0, 500);
    return { kind: /cowork/i.test(t) ? 'cowork' : 'other', chat_uuid: null, url };
  }
  return { error: "That isn't a Claude link. It should start with claude.ai/ or claude://" };
}
const projectIdFrom = (text) => (String(text || '').match(new RegExp(`claude\\.ai/project/(${U})`, 'i')) || [])[1]?.toLowerCase() || null;

function descendants(id) { const out = []; for (const c of children(id, true)) out.push(c.id, ...descendants(c.id)); return out; }
const hiddenSec = (s) => { for (let x = s; x; x = parentOf(x)) if (x.archived_at) return true; return false; };
const archivedGroups = () => S.sections.filter((s) => s.archived_at).sort((a, b) => String(b.archived_at).localeCompare(String(a.archived_at)));
function tree(pid = null, depth = 0, skip = new Set()) {
  return children(pid).filter((s) => !skip.has(s.id)).flatMap((s) => [{ s, depth }, ...tree(s.id, depth + 1, skip)]);
}
const pathOf = (s) => { const p = []; for (let x = s; x; x = parentOf(x)) p.unshift(x.name); return p.join(' › '); };
const colorOf = (s) => { for (let x = s; x; x = parentOf(x)) if (x.color) return x.color; return null; };
const secOf = (c) => secById(c.section_id) || inbox();
const active = () => S.chats.filter((c) => !c.archived_at && !hiddenSec(secOf(c)));
const archived = () => S.chats.filter((c) => c.archived_at).sort((a, b) => String(b.archived_at).localeCompare(String(a.archived_at)));
const chatsIn = (sid) => active().filter((c) => secOf(c)?.id === sid).sort(bySort('position'));
const totalIn = (sid) => chatsIn(sid).length + children(sid).reduce((n, s) => n + totalIn(s.id), 0);
const pins = () => active().filter((c) => c.pinned).sort(bySort('pin_position'));
const colorCls = (c) => (c ? ` c-${c}` : '');
// Projects = top-level groups other than Inbox. One can be active; the rest are parked.
const projects = () => children(null).filter((s) => !s.is_inbox);
const activeProject = () => projects().find((s) => s.status === 'active') || null;
const parkedProjects = () => projects().filter((s) => s.status !== 'active');
const docOf = (s) => (s?.doc && typeof s.doc === 'object' ? s.doc : {});
const allChatsIn = (s) => { const ids = new Set([s.id, ...descendants(s.id)]); return active().filter((c) => ids.has(secOf(c)?.id)); };
// The chat that answers prompts: chosen one, else highest "Build N", else Scope, else newest.
function homeChat(s) {
  const list = allChatsIn(s).filter((c) => linkFor(c));
  const set = s.home_chat_id && list.find((c) => c.id === s.home_chat_id);
  if (set) return set;
  const num = (c) => { const m = c.name.match(/build\s*(\d+)/i); return m ? +m[1] : -1; };
  const builds = list.filter((c) => num(c) >= 0).sort((a, b) => num(b) - num(a));
  if (builds.length) return builds[0];
  return list.find((c) => /scope/i.test(c.name)) || [...list].sort((a, b) => String(b.created_at).localeCompare(String(a.created_at)))[0] || null;
}
const gIcon = (s) => `<span class="gicon">${s.icon ? esc(s.icon) : ICON.folder}</span>`;

// ---------- server ----------
async function api(path, opts = {}) {
  const res = await fetch(path, {
    method: opts.method || 'GET',
    headers: { 'Content-Type': 'application/json', ...(S.token ? { Authorization: 'Bearer ' + S.token } : {}) },
    body: opts.body ? JSON.stringify(opts.body) : undefined,
    keepalive: !!opts.keepalive,
  });
  let j = {};
  try { j = await res.json(); } catch {}
  if (res.status === 401 && path !== '/api/login') { signOut(j.error); throw new Error(j.error || 'Signed out.'); }
  if (!res.ok) throw new Error(j.error || `Request failed (${res.status}).`);
  return j;
}
async function load() {
  try {
    const j = await api('/api/data');
    S.sections = j.sections || []; S.chats = (j.chats || []).map((c) => ({ kind: 'chat', notes: '', todos: [], ...c }));
    S.settings = Object.fromEntries((j.settings || []).map((r) => [r.id, r.value]));
    S.loaded = true; saveCache();
    const t = S.settings.theme?.preset;
    if (t && THEMES[t] && t !== S.theme) applyTheme(t);
    if (S.view === 'detail') { renderTop(); return; } // don't clobber what you're typing
    renderContent(); renderTop();
  } catch (err) {
    if (S.token) toast(S.loaded ? 'Offline. Showing your saved list.' : err.message, true);
  }
}
let chain = Promise.resolve();
function push(ops) {
  saveCache();
  chain = chain.then(() => api('/api/data', { method: 'POST', body: { ops } }))
    .catch((err) => { toast(`Couldn't save. ${err.message}`, true); return load(); });
  return chain;
}
function renumber(list, key, extra = {}) {
  const changed = [];
  list.forEach((c, i) => {
    const diff = c[key] !== i || Object.entries(extra).some(([k, v]) => c[k] !== v);
    if (diff) { c[key] = i; Object.assign(c, extra); changed.push({ id: c.id, [key]: i, ...extra }); }
  });
  return changed;
}

function subline(c, showPath) {

// Mac: groups pack into columns (masonry), item page opens as a side panel.
const WIDE = window.matchMedia ? matchMedia('(min-width: 900px)') : { matches: false, addEventListener() {} };
const wide = () => WIDE.matches;
const ro = 'ResizeObserver' in window ? new ResizeObserver((es) => es.forEach((e) => sizeSec(e.target))) : null;
function sizeSec(el) {

// ---------- active project dashboard ----------
// Doc v2 (v1 docs read through normDoc): status, now, next, details, tools{name,role,url},

const STATUSES = ['Idea', 'Scoping', 'Building', 'Testing', 'Live', 'Paused', 'Blocked'];
const statusCls = (t) => {
  const x = String(t || '').toLowerCase();

  if (/block|stuck|broken/.test(x)) return 'st-bad';
  if (/pause|wait|hold/.test(x)) return 'st-mute';

  return 'st-go';
};
function normDoc(s) {

    details: Array.isArray(d.details) ? d.details : [],
    tools: (Array.isArray(d.tools) ? d.tools : []).map((t) => (typeof t === 'string' ? { name: t, role: '', url: '' } : { name: t.name || '', role: t.role || '', url: t.url || '' })).filter((t) => t.name),
    accounts: (Array.isArray(d.accounts) ? d.accounts : []).map((a) => ({ name: a.name || '', item: a.item || '', vault: a.vault || '', link: a.link || '' })).filter((a) => a.name),
    env: Array.isArray(d.env) ? d.env : [], links: Array.isArray(d.links) ? d.links : [], notes: Array.isArray(d.notes) ? d.notes : [],
    updated_at: d.updated_at,
  };
}
// Sections the "Fill in with Claude" prompt can ask for.
const FILL = {

  tools: { title: 'Stack', empty: (d) => !d.tools.length },
  accounts: { title: 'Accounts', empty: (d) => !d.accounts.length },
  env: { title: 'Env Vars', empty: (d) => !d.env.length },
  links: { title: 'Links', empty: (d) => !d.links.length },
  notes: { title: 'Deploy Notes', empty: (d) => !d.notes.length },

const missingOf = (d) => Object.keys(FILL).filter((k) => FILL[k].empty(d));

const LINK_ICON = {

  live: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/></svg>',

};
function linkIcon(l) {
  const u = l.url.toLowerCase(), t = (l.label || '').toLowerCase();
  if (u.includes('github.com')) return LINK_ICON.github;

const splitPath = (g) => String(g || '').split(/\s*[›>]\s*/).map((x) => x.trim().slice(0, 80)).filter(Boolean);

function parseImport(text) {
  const t = String(text || '').trim();
  if (!t) return { error: 'Nothing to import yet.' };
  const a = t.indexOf('{'), b = t.lastIndexOf('}');
  if (a < 0 || b < a) return { error: "That doesn't look like a Threads import. It should start with {" };
  let j;
  try { j = JSON.parse(t.slice(a, b + 1)); } catch { return { error: "Couldn't read that. Make sure you copied all of it, from the first { to the last }." }; }
  if (j.threads_project) return parseProjectUpdate(j);
  const raw = Array.isArray(j.items) ? j.items : [];
  if (!raw.length) return { error: 'No items found in that list.' };
  const meta = {};
  (Array.isArray(j.groups) ? j.groups : []).forEach((g) => { if (g?.path) meta[splitPath(g.path).join(' › ').toLowerCase()] = { icon: g.icon ? String(g.icon).slice(0, 16) : null, color: COLORS.includes(g.color) ? g.color : null }; });
  const seen = new Set(), items = [], skipped = [], bad = [];
  for (const it of raw) {
    const name = String(it?.name || '').trim().slice(0, 80) || 'Untitled';
    const p = it?.link ? parseLink(it.link) : { kind: KIND[it?.kind] ? it.kind : 'cowork', chat_uuid: null, url: null, none: true };
    if (p.error) { bad.push(name); continue; }
    const key = p.chat_uuid || p.url;
    if (key && seen.has(key)) continue;
    if (key) seen.add(key);
    if (!p.none && S.chats.some((c) => sameItem(c, p))) { skipped.push(name); continue; }
    items.push({ name, p, path: splitPath(it.group), notes: String(it.notes || '').slice(0, 20000),
      todos: (Array.isArray(it.todos) ? it.todos : []).map((x) => String(x).trim().slice(0, 300)).filter(Boolean).slice(0, 50),
      archived: !!it.archived, pinned: !!it.pinned });
  }
  return { items, skipped, bad, meta };
}
// Finds each group by name (case doesn't matter), or plans a new one.

    key = key ? `${key} › ${name.toLowerCase()}` : name.toLowerCase();
    if (plan.map[key]) { parent = plan.map[key]; continue; }
    const hit = children(parent, true).find((s) => s.name.toLowerCase() === name.toLowerCase());
    if (hit) { plan.map[key] = hit.id; parent = hit.id; continue; }
    const m = plan.meta[key] || {};
    const row = { id: uid(), name, parent_id: parent, position: children(parent, true).length + plan.rows.filter((r) => r.parent_id === parent).length,
      color: m.color || (parent ? null : COLORS[plan.colorIdx++ % COLORS.length]), icon: m.icon || null, project_uuid: null, archived_at: null, status: 'parked', doc: {}, created_at: nowISO() };

const SECRETISH = /pass(word|code|phrase)?|secret|token|api[_ -]?key|private[_ -]?key|^value$|^val$/i;

  const patch = {}, str = (v, n) => String(v ?? '').trim().slice(0, n);
  let dropped = 0;
  const scan = (o, keep) => Object.keys(o || {}).forEach((k) => { if (!keep.includes(k) && SECRETISH.test(k)) dropped++; });

  if ('next' in j) patch.next = str(j.next, 400);

  if (Array.isArray(j.notes)) patch.notes = j.notes.map((x) => str(x, 300)).filter(Boolean).slice(0, 30);

    scan(x, ['name', 'item', 'vault', 'link']);

}

  },
  'sec-toggle': (el) => {
    const id = el.dataset.id;
    collapsed.has(id) ? collapsed.delete(id) : collapsed.add(id);
    localStorage.setItem('threads.collapsed', JSON.stringify([...collapsed]));
    el.closest('.sec').classList.toggle('closed', collapsed.has(id));
  },
  'sec-menu': (el) => openGroupForm(el.dataset.id),
  'sec-new': () => openGroupForm(null),
  'sec-new-sub': (el) => openGroupForm(null, el.dataset.id),
  'g-save': (el) => saveGroup(el.dataset.id),
  'sec-delete': (el) => deleteGroup(el.dataset.id, el),
  'sec-archive': (el) => archiveGroup(el.dataset.id),
  'unarchive-group': (el) => unarchiveGroup(el.dataset.id),
  'import-open': () => openImport(),
  page: (el) => { S.page = el.dataset.v; localStorage.setItem('threads.page', S.page); S.view = 'main'; renderTop(); renderContent(); scrollTo(0, 0); },
  config: (el) => { if (!S.dragging) openConfig(el.dataset.id); },
  'all-tools': () => openAllTools(),
  expand: (el) => el.classList.toggle('open'),
  'make-active': (el) => makeActive(el.dataset.id),
  park: (el) => openParkSheet(el.dataset.id),
  'park-only': (el) => { closeSheet(); parkProject(el.dataset.id); },
  'swap-in': (el) => makeActive(el.dataset.id),
  'doc-edit': (el) => openDocEdit(el.dataset.id, el.dataset.k),
  'doc-save': (el) => saveDocEdit(el.dataset.id, el.dataset.k),
  'copy-prompt': async (el) => {
    const s = secById(el.dataset.id), h = homeChat(s);
    try {
      await navigator.clipboard.writeText(promptFor(s, el.dataset.k.split(',')));
      awaitPaste('update');
      toast(h ? `Prompt copied. Paste it in ${s.name} · ${h.name}` : 'Prompt copied');
    } catch { toast("Couldn't copy.", true); }
  },
  sync: () => runSync(),
  'sync-setup': () => openSyncSetup(),
  'sync-set': (el) => {
    S.settings.sync = { chat_id: el.dataset.id };
    closeSheet(); toast('Sync is set up');
    push([{ op: 'upsert', table: 'settings', row: { id: 'sync', value: S.settings.sync } }]);
  },
  'banner-paste': async () => {
    try {
      const t = await navigator.clipboard.readText();
      if (!/"threads_(import|project)"/.test(t)) return toast("Your clipboard doesn't have the reply yet. Copy the code block in Claude first.", true);
      S.awaitPaste = null; sessionStorage.removeItem('threads.await'); hideBanner();
      openImport(); $('#imp-text').value = t; previewImport(t);
    } catch { openImport(); }
  },
  'banner-import': () => { const t = S.bannerText; dismissed.add(t); hideBanner(); openImport(); $('#imp-text').value = t; previewImport(t); },
  'proj-go': () => {
    const r = S.projPlan; if (!r) return;
    S.projPlan = null; S.awaitPaste = null; sessionStorage.removeItem('threads.await');
    closeSheet(); setDoc(r.project, r.patch, true); toast(`Updated ${r.project.name}`);
  },
  close: () => closeSheet(),
  'imp-paste': async () => {
    try { const t = await navigator.clipboard.readText(); $('#imp-text').value = t; previewImport(t); }
    catch { $('#imp-err').textContent = "Couldn't read the clipboard. Paste into the box instead."; }
  },
  'imp-preview': () => previewImport($('#imp-text').value),
  'imp-go': () => runImport(),
  'delete-group-forever': (el) => deleteGroupForever(el.dataset.id, el),
  archive: () => { S.view = 'archive'; hideBanner(); renderTop(); renderContent(); scrollTo(0, 0); },
  settings: () => openSettings(),
  'theme-set': (el) => {
    applyTheme(el.dataset.v);
    S.settings.theme = { preset: S.theme };
    openSettings();
    push([{ op: 'upsert', table: 'settings', row: { id: 'theme', value: { preset: S.theme } } }]);
  },
  'link-set': (el) => { localStorage.setItem('threads.link', el.dataset.v); openSettings(); renderContent(); },
  signout: () => signOut(),
  'filter-clear': (el, ev) => { ev.preventDefault(); $('#filter').value = ''; S.filter = ''; renderContent(); },
  'banner-add': () => { const t = S.bannerText; openAdd(); handleAddText(t); },
  'banner-x': () => { if (S.bannerText) dismissed.add(S.bannerText); S.awaitPaste = null; sessionStorage.removeItem('threads.await'); hideBanner(); },
};
document.addEventListener('click', (ev) => {
  if (ev.target.id === 'scrim') return closeSheet();
  const el = ev.target.closest('[data-act]');
  if (el && A[el.dataset.act]) A[el.dataset.act](el, ev);
});
document.addEventListener('submit', (ev) => { if (ev.target.id === 'login-form') login(ev); });
document.addEventListener('input', (ev) => {
  const t = ev.target;
  if (t.id === 'filter') { S.filter = t.value.trim(); renderContent(); return; }
  if (t.id === 'add-text' || t.id === 'link-text') {
    const v = t.value.trim(), err = $(t.id === 'add-text' ? '#add-err' : '#link-err');
    if (!v) { err.textContent = ''; return; }
    const r = parseLink(v);
    if (r.error) { err.textContent = r.error; return; }
    return t.id === 'add-text' ? showAddForm(r) : applyLink(t.dataset.id, v);
  }
  if (t.id === 'de-now' || t.id === 'de-next') counts();
  if (t.id === 'g-icon-custom' && t.value.trim()) $$('#g-icon .emo').forEach((b) => b.classList.remove('on'));
  const c = (S.view === 'detail' || S.panel) && chatById(S.detailId);
  if (!c) return;
  if (t.id === 'd-name' && t.value.trim()) { c.name = t.value.trim().slice(0, 80); queueSave(c.id, { name: c.name }); }
  if (t.id === 'd-notes') { c.notes = t.value; autosize(); queueSave(c.id, { notes: c.notes }); }
  if (t.classList.contains('todo-text')) {
    const td = c.todos.find((x) => x.id === t.dataset.tid);
    if (td) { td.text = t.value; queueSave(c.id, { todos: c.todos }); }
  }
});
document.addEventListener('change', (ev) => {
  if (ev.target.id === 'imp-file') {
    const f = ev.target.files?.[0];
    if (!f) return;
    const rd = new FileReader();
    rd.onload = () => { $('#imp-text').value = rd.result; previewImport(rd.result); };
    rd.readAsText(f);
    return;
  }
  if (ev.target.id !== 'd-pin') return;
  const c = chatById(ev.target.dataset.id), on = ev.target.checked;
  c.pinned = on; c.pin_position = on ? pins().filter((x) => x.id !== c.id).length : null;
  const rows = [{ id: c.id, pinned: on, pin_position: c.pin_position }, ...(on ? [] : renumber(pins(), 'pin_position'))];
  toast(on ? 'Pinned' : 'Unpinned');
  push([{ op: 'patch', table: 'chats', rows }]);
});
document.addEventListener('focusout', (ev) => {
  if (ev.target.id === 'd-name' && !ev.target.value.trim()) ev.target.value = chatById(S.detailId)?.name || '';
});
document.addEventListener('keydown', (ev) => {
  const mod = ev.metaKey || ev.ctrlKey;
  const typing = /INPUT|TEXTAREA|SELECT/.test(document.activeElement?.tagName || '');
  if (S.token && mod && ev.key.toLowerCase() === 'k') {
    ev.preventDefault();
    if (S.view === 'detail' || S.view === 'config') backToMain();
    closeSheet(); $('#filter')?.focus(); $('#filter')?.select(); return;
  }
  if (S.token && ((mod && ev.key.toLowerCase() === 'n') || (!mod && !typing && ev.key === 'n' && !$('#sheet').classList.contains('on')))) {
    ev.preventDefault(); openAdd(); return;
  }
  if (ev.key === 'Escape') {
    if ($('#sheet').classList.contains('on')) closeSheet();
    else if (S.panel) closePanel();
    else if (document.activeElement?.id === 'filter' && S.filter) { $('#filter').value = ''; S.filter = ''; renderContent(); }
    else if (S.view !== 'main') backToMain();
  }
  if (ev.key !== 'Enter') return;
  const id = ev.target.id;
  if (id === 'todo-new') {
    ev.preventDefault();
    const text = ev.target.value.trim(), c = chatById(S.detailId);
    if (!text || !c) return;
    c.todos = [...(c.todos || []), { id: uid().slice(0, 8), text: text.slice(0, 300), done: false }];
    ev.target.value = ''; renderTodos(true); queueSave(c.id, { todos: c.todos }, 0);
  }
  if (id === 'd-name' || ev.target.classList.contains('todo-text')) { ev.preventDefault(); ev.target.blur(); }
  if (id === 'ac-name') { ev.preventDefault(); saveNew(); }
  if (id === 'g-name') { ev.preventDefault(); $('[data-act="g-save"]')?.click(); }
});
// Long-press is for dragging, so stop iOS link previews on cards.
document.addEventListener('contextmenu', (ev) => { if (ev.target.closest('.chat, .pin')) ev.preventDefault(); });
window.addEventListener('pagehide', flushSaves);

// Switching between phone and Mac layouts (resizing the window)
WIDE.addEventListener('change', () => {
  if (!S.token) return;
  if (wide() && S.view === 'detail') {
    const id = S.detailId; flushSaves();
    S.view = 'main'; S.detailId = null;
    renderTop(); renderContent(); openDetail(id);
  } else if (!wide() && S.panel) {
    const id = S.detailId; closePanel(); openDetail(id);
  } else packGroups();
});

// ?add=<link> opens the add card (for a share-sheet Shortcut later)
function handleQuery() {
  const add = new URL(location.href).searchParams.get('add');
  if (!add || !S.token) return;
  history.replaceState(null, '', location.pathname);
  openAdd(add);
}

let lastLoad = Date.now();
document.addEventListener('visibilitychange', () => {
  if (document.hidden) return flushSaves();
  if (!S.token) return;
  setSky();
  if (Date.now() - lastLoad > 60e3) { lastLoad = Date.now(); load(); }
  S.awaitPaste = S.awaitPaste || sessionStorage.getItem('threads.await');
  if (S.awaitPaste) showPasteBanner();
  checkClipboard();
});
window.addEventListener('focus', checkClipboard);

// ---------- boot ----------
applyTheme(S.theme);
if (S.token) loadCache();
render();
if (S.token) { load().then(checkClipboard); handleQuery(); }
</script>
</body>
</html>

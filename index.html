<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0d1424">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="color-scheme" content="dark light">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Threads">
<title>Threads</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icon-180.png">
<link rel="icon" type="image/png" href="/icon-192.png">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.2/Sortable.min.js"></script>
<style>
:root{
  --night:#0d1424; --night-2:#141d31;
  --ink:#eef2f8; --ink-2:#aab3c5; --ink-3:#6f7a91;
  --line:rgba(255,255,255,.09); --glass:rgba(255,255,255,.055);
  --sheet:rgba(21,30,51,.94); --bar:rgba(22,31,52,.72);
  --hi:rgba(255,255,255,.12); --field:rgba(255,255,255,.07); --shadow:rgba(3,6,15,.32);
  --dawn:#f2c46d; --dawn-ink:#1d1606; --danger:#ff6b61; --ok:#3ecf8e; --warn:#f2c46d;
  --sky:rgba(90,165,255,.20); --sky2:rgba(120,200,255,.10);
  --card:color-mix(in srgb,var(--ink) 6%,transparent); --line2:color-mix(in srgb,var(--ink) 11%,transparent);
  /* Arc / macOS: rounded rectangles, no pills */
  --r-lg:12px; --r-md:10px; --r-sm:8px;
  --side:264px; --gap:0px; --topgap:10px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{background:var(--night)}
html,body{min-height:100%}
body{font:15px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",system-ui,sans-serif;color:var(--ink);
  background:linear-gradient(180deg,var(--night),var(--night-2)) fixed;background-color:var(--night);
  -webkit-font-smoothing:antialiased;transition:background .6s,color .6s}
body::before{content:'';position:fixed;inset:0 0 calc(-1 * var(--gap)) 0;pointer-events:none;z-index:-1;
  background:radial-gradient(120% 60% at 15% -10%,var(--sky),transparent 60%),radial-gradient(90% 50% at 100% 0%,var(--sky2),transparent 60%)}
button,input,select,textarea{font:inherit;color:inherit;background:none;border:0;outline:0}
button{cursor:pointer}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--dawn);outline-offset:2px}
[hidden]{display:none!important}
svg{display:block}
.glass{background:var(--card);border:1px solid var(--line2);box-shadow:0 1px 0 color-mix(in srgb,var(--ink) 5%,transparent) inset,0 6px 18px var(--shadow)}
.muted{color:var(--ink-3);font-size:13px}
code{font:600 13px ui-monospace,SFMono-Regular,Menlo,monospace}

/* ---------- shell ---------- */
#app.authed{min-height:100vh}
.side{display:none}
.main{min-width:0;padding:calc(env(safe-area-inset-top) + var(--topgap)) 16px calc(env(safe-area-inset-bottom) + var(--gap) + 86px)}
.mtop{display:flex;align-items:center;gap:6px;min-height:44px;margin-bottom:10px}
.mtop h1{flex:1;min-width:0;font-size:28px;font-weight:750;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mtop h1.sm{font-size:17px;font-weight:650;letter-spacing:-.01em}
.icon-btn{width:38px;height:38px;border-radius:var(--r-sm);display:grid;place-items:center;color:var(--ink-2);position:relative;flex:none}
.icon-btn svg{width:20px;height:20px}
.icon-btn:hover{background:var(--field)}
.add-btn{height:34px;padding:0 12px 0 9px;border-radius:var(--r-sm);background:var(--dawn);color:var(--dawn-ink);font-weight:650;font-size:14px;display:inline-flex;align-items:center;gap:5px;flex:none;white-space:nowrap}
.add-btn svg{width:17px;height:17px}
.sfield{display:flex;align-items:center;gap:8px;height:36px;padding:0 6px 0 10px;border-radius:var(--r-sm);background:var(--field);border:1px solid var(--line)}
.sfield svg{width:15px;height:15px;color:var(--ink-3);flex:none}
.sfield input{flex:1;min-width:0;height:100%;font-size:15px}
.sfield input::placeholder{color:var(--ink-3)}
.sfield input:focus-visible{outline:none}
.sfield:focus-within{border-color:color-mix(in srgb,var(--dawn) 60%,var(--line))}
.sfield kbd{font:600 11px -apple-system,system-ui,sans-serif;color:var(--ink-3);border:1px solid var(--line);border-radius:5px;padding:1px 5px;flex:none}
.sfield .clear{width:24px;height:24px;border-radius:6px;color:var(--ink-3);font-size:17px;line-height:1}
.mtop + .sfield,.msearch{margin-bottom:14px}
.msearch .sfield{height:40px}

/* phone tab bar */
.tabbar{position:fixed;left:0;right:0;bottom:calc(-1 * var(--gap));z-index:35;display:grid;grid-template-columns:repeat(4,1fr);
  padding:6px 10px calc(env(safe-area-inset-bottom) + var(--gap) + 6px);background:var(--bar);border-top:1px solid var(--line);
  -webkit-backdrop-filter:blur(24px) saturate(1.5);backdrop-filter:blur(24px) saturate(1.5)}
.tb{display:grid;justify-items:center;gap:2px;padding:4px 0;font-size:11px;font-weight:600;color:var(--ink-3);position:relative}
.tb svg{width:23px;height:23px}
.tb.on{color:var(--dawn)}
.tb i{position:absolute;top:0;left:calc(50% + 8px);min-width:17px;height:17px;padding:0 4px;border-radius:9px;background:var(--danger);color:#fff;font:700 10px/17px system-ui;font-style:normal}
body.v-detail .tabbar{display:none}
body.v-detail .main{padding-bottom:calc(env(safe-area-inset-bottom) + 40px)}

/* ---------- sidebar (computer) ---------- */
@media (min-width:900px){
  #app.authed{display:grid;grid-template-columns:var(--side) minmax(0,1fr)}
  .side{display:flex;flex-direction:column;gap:2px;position:sticky;top:0;height:100vh;overflow:auto;padding:14px 10px 10px;
    background:var(--bar);border-right:1px solid var(--line);-webkit-backdrop-filter:blur(30px) saturate(1.5);backdrop-filter:blur(30px) saturate(1.5);scrollbar-width:thin}
  .main{padding:26px 34px 60px}
  .mtop,.tabbar,.msearch{display:none!important}
  body.has-panel .main{padding-right:calc(min(440px,38vw) + 50px)}
}
.side-top{display:flex;align-items:center;gap:6px;padding:2px 4px 10px}
.brand{flex:1;font-size:17px;font-weight:750;letter-spacing:-.015em;display:flex;align-items:center;gap:8px}
.brand i{font-style:normal;width:26px;height:26px;border-radius:7px;display:grid;place-items:center;background:color-mix(in srgb,var(--dawn) 22%,transparent);font-size:14px}
.side-top .icon-btn{width:30px;height:30px}
.side-top .icon-btn svg{width:17px;height:17px}
.side .sfield{margin:0 2px 6px;height:32px}
.syncbtn{display:flex;align-items:center;gap:8px;height:34px;padding:0 10px;margin:0 2px 10px;border-radius:var(--r-sm);background:var(--field);border:1px solid var(--line);font-weight:600;font-size:14px;text-align:left}
.syncbtn svg{width:16px;height:16px;color:var(--dawn);flex:none}
.syncbtn span{flex:1}
.syncbtn small{color:var(--ink-3);font-size:12px;font-weight:500}
.syncbtn:hover{background:var(--hi)}
.srow,.sproj{display:flex;align-items:center;gap:9px;width:100%;min-height:32px;padding:0 8px;border-radius:var(--r-sm);text-align:left;font-size:14px;font-weight:550;color:var(--ink-2);
  -webkit-touch-callout:none;user-select:none;-webkit-user-select:none}
.srow svg{width:17px;height:17px;flex:none;color:var(--ink-3)}
.srow span,.sproj b{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:550}
.srow small,.sproj small{font-size:12px;color:var(--ink-3);font-weight:600}
.srow:hover,.sproj:hover{background:var(--field);color:var(--ink)}
.srow.on,.sproj.on{background:var(--hi);color:var(--ink)}
.srow.on svg{color:var(--dawn)}
.srow .ncount{font-style:normal;min-width:20px;height:18px;padding:0 6px;border-radius:9px;background:color-mix(in srgb,var(--danger) 85%,transparent);color:#fff;font:700 11px/18px system-ui;text-align:center}
.sproj .gicon{width:22px;height:22px;min-width:22px;border-radius:6px;font-size:13px}
.sproj .gicon svg{width:13px;height:13px}
.sproj .new{font-style:normal;font-size:10px;font-weight:750;color:var(--dawn);letter-spacing:.02em}
.sh{display:flex;align-items:center;gap:6px;width:100%;height:28px;padding:0 6px 0 8px;margin-top:10px;font-size:12px;font-weight:650;color:var(--ink-3);text-align:left;border-radius:6px}
.sh span{flex:1}
.sh .chev{width:12px;height:12px;transition:transform .32s cubic-bezier(.32,.72,0,1)}
.sh.closed .chev{transform:rotate(-90deg)}
.sh .mini{width:22px;height:22px;border-radius:6px;display:grid;place-items:center;color:var(--ink-3);opacity:0;transition:opacity .15s}
.sh:hover .mini,.sh:focus-within .mini{opacity:1}
.sh .mini svg{width:14px;height:14px}
.sh .mini:hover{background:var(--field)}
.slist{display:grid;gap:1px;min-height:6px}
.sfold{display:grid;grid-template-rows:1fr;opacity:1;transition:grid-template-rows .32s cubic-bezier(.32,.72,0,1),opacity .24s ease}
.sfold > .sfi{min-height:0;overflow:hidden}
.sfold.closed{grid-template-rows:0fr;opacity:0}
.sfold.closed > .sfi{visibility:hidden;transition:visibility 0s .32s}
.slist:empty::before{content:'Drag a project here';display:block;padding:6px 10px;color:var(--ink-3);font-size:12px;border:1px dashed var(--line);border-radius:var(--r-sm);margin:2px 0}
.side-foot{margin-top:auto;padding-top:12px;display:grid;gap:1px;border-top:1px solid var(--line)}
.side > *{flex-shrink:0} /* threads-10: long folders scroll instead of overlapping */
.brand{border-radius:var(--r-sm);padding:2px 4px;margin-left:-4px;text-align:left}
.brand:hover{background:var(--field)}
.srow.sub{padding-left:30px;min-height:28px;font-size:13px}
.srow .sic{width:22px;height:22px;border-radius:6px;display:grid;place-items:center;font-size:13px;flex:none;background:var(--field)}
.rail-only{display:none!important}
.side-rz{display:none}
@media (min-width:900px){
  .side-rz{display:block;position:fixed;top:0;bottom:0;left:calc(var(--side) - 4px);width:8px;cursor:col-resize;z-index:31;touch-action:none}
  .side-rz::after{content:'';position:absolute;top:0;bottom:0;left:3px;width:2px;background:transparent;transition:background .15s}
  .side-rz:hover::after,body.resizing .side-rz::after{background:var(--dawn)}
  body.resizing{cursor:col-resize;user-select:none;-webkit-user-select:none}
  body.resizing .side,body.resizing .main{pointer-events:none}
  /* icon rail: drag the edge in past ~150px */
  body.rail .side{padding:12px 8px;align-items:stretch}
  body.rail .lbl,body.rail .side .sfield,body.rail .sh > *,body.rail .sproj b,body.rail .sproj .new,body.rail .spin > span:not(.kic),body.rail .srow small,body.rail .syncbtn small{display:none!important}
  body.rail .rail-only{display:grid!important}
  body.rail .side-top{flex-direction:column;padding:2px 0 8px;gap:4px}
  body.rail .brand{margin:0;padding:2px;justify-content:center}
  body.rail .srow,body.rail .sproj,body.rail .spin,body.rail .syncbtn{justify-content:center;padding:0;min-height:36px;position:relative}
  body.rail .syncbtn{margin:0 0 8px}
  body.rail .srow.sub{padding:0}
  body.rail .sh{height:1px;margin:8px 6px;padding:0;border-top:1px solid var(--line);border-radius:0}
  body.rail .sproj .gicon{width:28px;height:28px;min-width:28px;font-size:15px}
  body.rail .sproj .dot{position:absolute;right:6px;top:5px;width:7px;height:7px;box-shadow:0 0 0 2px var(--night)}
  body.rail .srow .ncount{position:absolute;top:1px;right:4px;min-width:16px;height:16px;font-size:10px;line-height:16px;padding:0 4px}
  body.rail .side-foot{padding-top:8px}
}
.spin{display:flex;align-items:center;gap:9px;min-height:30px;padding:0 8px;border-radius:var(--r-sm);font-size:13.5px;color:var(--ink-2);user-select:none;-webkit-user-select:none}
.spin:hover{background:var(--field);color:var(--ink)}
.spin .kic{width:20px;height:20px;border-radius:5px}
.spin .kic svg{width:12px;height:12px}
.spin > span:not(.kic){flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.spin em{font-style:normal;color:var(--ink-3)}

/* health dots + badges */
.dot{width:8px;height:8px;border-radius:50%;flex:none;background:var(--ink-3);opacity:.6}
.dot.ok{background:var(--ok);opacity:1}.dot.waiting{background:var(--warn);opacity:1}.dot.stuck{background:var(--danger);opacity:1}
.shipck{display:grid;place-items:center;width:14px;height:14px;flex:none;color:var(--ok);opacity:.85}
.shipck svg{width:12px;height:12px}
.hb.live{background:color-mix(in srgb,var(--ok) 14%,transparent);color:color-mix(in srgb,var(--ok) 75%,var(--ink))}
.shipcard .pc-f .act{height:28px;font-size:12.5px}
.dot.unknown{background:transparent;border:1.5px solid var(--ink-3);opacity:.7}
.hb{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 8px;border-radius:6px;font-size:12px;font-weight:650;white-space:nowrap;flex:none;background:var(--hi);color:var(--ink-2)}
.hb::before{content:'';width:6px;height:6px;border-radius:50%;background:currentColor}
.hb.ok{background:color-mix(in srgb,var(--ok) 18%,transparent);color:color-mix(in srgb,var(--ok) 80%,var(--ink))}
.hb.waiting{background:color-mix(in srgb,var(--warn) 20%,transparent);color:color-mix(in srgb,var(--warn) 85%,var(--ink))}
.hb.stuck{background:color-mix(in srgb,var(--danger) 18%,transparent);color:color-mix(in srgb,var(--danger) 80%,var(--ink))}
.hb.nudge{background:color-mix(in srgb,var(--danger) 10%,transparent);color:color-mix(in srgb,var(--danger) 60%,var(--ink-2))}
.hb.unknown,.hb.archived{background:var(--field);color:var(--ink-3)}
.hb.plain::before{display:none}
.tagx{display:inline-flex;align-items:center;gap:4px;height:20px;padding:0 7px;border-radius:5px;font-size:11.5px;font-weight:650;background:var(--field);color:var(--ink-2);white-space:nowrap}
.tagx svg{width:11px;height:11px}
.tagx.warn{background:color-mix(in srgb,var(--warn) 16%,transparent);color:color-mix(in srgb,var(--warn) 80%,var(--ink))}
.tagx.bad{background:color-mix(in srgb,var(--danger) 14%,transparent);color:color-mix(in srgb,var(--danger) 75%,var(--ink))}
.tagx.ok{background:color-mix(in srgb,var(--ok) 15%,transparent);color:color-mix(in srgb,var(--ok) 75%,var(--ink))}

/* ---------- pages ---------- */
.page{display:grid;gap:22px;min-width:0}
.ph{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.ph h1{font-size:26px;font-weight:750;letter-spacing:-.02em}
.ph .muted{flex:1}
.ph-a{display:flex;gap:8px;align-items:center;margin-left:auto}
@media (max-width:899px){.page > .ph{display:none}.page{gap:18px}}
.blk{display:grid;gap:10px;min-width:0}
.blk-h{display:flex;align-items:center;gap:10px}
.blk-h h2{font-size:16px;font-weight:700;letter-spacing:-.01em}
.blk-h .muted{flex:1}
.blk-h .lnkbtn{margin-left:auto}
.lnkbtn{font-size:13px;font-weight:600;color:var(--dawn);padding:4px 6px;border-radius:6px}
.lnkbtn:hover{background:var(--field)}

/* health strip */
.hstrip{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.hs{display:grid;gap:2px;padding:12px 14px;border-radius:var(--r-lg);text-align:left;position:relative}
.hs b{font-size:28px;font-weight:750;letter-spacing:-.02em;line-height:1.1}
.hs span{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:var(--ink-2)}
.hs.on{border-color:var(--dawn);box-shadow:0 0 0 1px var(--dawn) inset}
.hs.unknown b{color:var(--ink-3)}
.hs.ok b{color:color-mix(in srgb,var(--ok) 85%,var(--ink))}.hs.waiting b{color:color-mix(in srgb,var(--warn) 90%,var(--ink))}.hs.stuck b{color:color-mix(in srgb,var(--danger) 85%,var(--ink))}
@media (max-width:899px){.hstrip{gap:7px}.hs{padding:9px 9px}.hs b{font-size:21px}.hs span{font-size:11px;gap:4px}}

/* do this next */
.dn{display:grid;border-radius:var(--r-lg);overflow:hidden}
.dn-row{display:flex;align-items:center;gap:12px;padding:11px 12px 11px 14px;min-width:0}
.dn-row + .dn-row{border-top:1px solid var(--line)}
.dn-row > .gicon{width:30px;height:30px;min-width:30px;border-radius:8px;font-size:16px}
.dn-t{flex:1;min-width:0;display:grid;gap:3px}
.dn-t > div{display:flex;align-items:center;gap:8px;min-width:0}
.dn-t b{font-weight:650;font-size:14px;white-space:nowrap}
.dn-t p{font-size:14px;color:var(--ink-2);line-height:1.35;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.dn-empty{padding:16px;color:var(--ink-3);font-size:14px}
@media (max-width:520px){.dn-row{flex-wrap:wrap;padding:11px 12px}.dn-row > .act{margin-left:42px}}

/* buttons: rounded rectangles */
.act,.pill-btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:30px;padding:0 11px;border-radius:var(--r-sm);font-size:13px;font-weight:620;white-space:nowrap;flex:none;
  background:var(--field);border:1px solid var(--line);color:var(--ink)}
.act svg,.pill-btn svg{width:14px;height:14px;flex:none}
.act:hover,.pill-btn:hover{background:var(--hi)}
.act.pri,.pill-btn.accent{background:color-mix(in srgb,var(--dawn) 22%,transparent);border-color:color-mix(in srgb,var(--dawn) 40%,transparent);color:color-mix(in srgb,var(--dawn) 85%,var(--ink))}
.pill-btn.warn{color:var(--danger)}
.more{width:30px;height:30px;border-radius:var(--r-sm);display:grid;place-items:center;color:var(--ink-3);flex:none}
.more svg{width:17px;height:17px}
.more:hover{background:var(--field);color:var(--ink)}

/* project cards */
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,290px),1fr));gap:12px}
.pcard{--c:var(--ink-3);display:grid;gap:8px;align-content:start;padding:14px;border-radius:var(--r-lg);cursor:pointer;min-width:0;position:relative;
  background:linear-gradient(180deg,color-mix(in srgb,var(--c) 11%,var(--card)),var(--card) 70%);border:1px solid color-mix(in srgb,var(--c) 26%,var(--line2))}
.pcard:hover{border-color:color-mix(in srgb,var(--c) 55%,var(--line2))}
.pc-h{display:flex;align-items:center;gap:10px;min-width:0}
.pc-h .gicon{width:32px;height:32px;min-width:32px;border-radius:9px;font-size:17px}
.pc-h b{flex:1;min-width:0;font-size:16px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pc-m{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:12.5px;color:var(--ink-3)}
.pc-m code{font-size:12px;color:var(--ink-2)}
.pc-why{font-size:12.5px;color:var(--ink-3);margin-top:-4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pc-why.waiting{color:color-mix(in srgb,var(--warn) 75%,var(--ink-2))}.pc-why.stuck{color:color-mix(in srgb,var(--danger) 70%,var(--ink-2))}
.pc-n{font-size:14px;line-height:1.4;color:var(--ink-2);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.8em}
.pc-n em{font-style:normal;font-weight:700;color:var(--c);margin-right:3px}
.pc-f{display:flex;align-items:center;gap:4px;flex-wrap:wrap}
.pc-f .li{width:28px;height:28px;border-radius:7px;display:grid;place-items:center;color:var(--ink-2);background:var(--field)}
.pc-f .li svg{width:14px;height:14px}
.pc-f .li:hover{background:var(--hi);color:var(--ink)}
.pc-f .sp{flex:1}
.empty-card{padding:18px;border-radius:var(--r-lg);color:var(--ink-3);font-size:14px;text-align:center;border:1px dashed var(--line)}

/* compact rows (phone, project lists) */
.prow{--c:var(--ink-3);display:flex;align-items:center;gap:11px;padding:10px 12px;min-width:0;text-align:left;width:100%}
.prow + .prow{border-top:1px solid var(--line)}
.prow .gicon{width:32px;height:32px;min-width:32px;border-radius:9px;font-size:17px}
.prow-t{flex:1;min-width:0;display:grid;gap:1px}
.prow-t b{font-weight:650;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prow-t span{font-size:13px;color:var(--ink-3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.plist{border-radius:var(--r-lg);overflow:hidden}
.plist .slist{gap:0}
.plist .slist:empty::before{margin:8px}
.plist .sproj{min-height:56px;border-radius:0;padding:8px 12px;gap:11px}
.plist .sproj + .sproj{border-top:1px solid var(--line)}
.plist .sproj .gicon{width:32px;height:32px;min-width:32px;border-radius:9px;font-size:17px}
.plist .sproj b{font-size:15px;font-weight:650;color:var(--ink)}
.plist .sproj .prow-t{display:grid;flex:1;min-width:0}
.plist .sproj .prow-t span{font-size:12.5px;color:var(--ink-3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* triage + system folders */
.sysrow{display:flex;align-items:center;gap:12px;padding:12px 14px;width:100%;text-align:left}
.sysrow + .sysrow{border-top:1px solid var(--line)}
.sysrow .gicon{width:32px;height:32px;min-width:32px;border-radius:9px;font-size:17px}
.sysrow .prow-t{flex:1;min-width:0;display:grid}
.sysrow .prow-t span{font-size:13px;color:var(--ink-3)}
.sysrow small{font-size:13px;font-weight:700;color:var(--ink-2)}
/* naming */
.nm{display:flex;align-items:center;gap:10px;padding:10px 12px 10px 14px;flex-wrap:wrap}
.nm + .nm{border-top:1px solid var(--line)}
.nm-t{flex:1;min-width:200px;display:grid;gap:2px}
.nm-t b{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nm-t span{font-size:13px;color:var(--ink-3);display:flex;align-items:center;gap:6px;min-width:0}
.nm-t code{color:var(--ok);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nm-a{display:flex;gap:6px;flex-wrap:wrap}

/* ---------- project page ---------- */
.pj-h{--c:var(--ink-3);display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:16px 16px;border-radius:var(--r-lg);
  background:linear-gradient(120deg,color-mix(in srgb,var(--c) 16%,var(--card)),var(--card) 65%);border:1px solid color-mix(in srgb,var(--c) 28%,var(--line2))}
.pj-h > .gicon{width:48px;height:48px;min-width:48px;border-radius:12px;font-size:25px}
.pj-t{flex:1;min-width:180px;display:grid;gap:6px}
.pj-t h1{font-size:24px;font-weight:750;letter-spacing:-.02em;line-height:1.15}
.pj-sub{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:13px;color:var(--ink-3)}
.tierbtn{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 8px;border-radius:6px;background:var(--field);border:1px solid var(--line);font-size:12px;font-weight:650;color:var(--ink-2)}
.tierbtn svg{width:11px;height:11px}
.pj-a{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
@media (max-width:899px){.pj-h{padding:12px;gap:11px}.pj-h > .gicon{width:40px;height:40px;min-width:40px;font-size:21px}.pj-t h1{font-size:20px}.pj-a{width:100%}.pj-a .more{margin-left:auto}}
.ptabs{display:flex;gap:2px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.ptabs::-webkit-scrollbar{display:none}
.ptab{height:36px;padding:0 12px;font-size:14px;font-weight:600;color:var(--ink-3);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.ptab small{font-size:11px;font-weight:700;background:var(--field);border-radius:5px;padding:0 5px;color:var(--ink-2)}
.ptab small.bad{background:color-mix(in srgb,var(--danger) 18%,transparent);color:color-mix(in srgb,var(--danger) 80%,var(--ink))}
.ptab:hover{color:var(--ink)}
.ptab.on{color:var(--ink);border-bottom-color:var(--dawn)}
.pbody{display:grid;gap:14px;min-width:0}
.ov{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:14px;align-items:start}
@media (max-width:1100px){.ov{grid-template-columns:minmax(0,1fr)}}
.dcard{--c:var(--ink-3);border-radius:var(--r-lg);padding:14px 16px;min-width:0}
.dcard-h{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.dcard-h h3{flex:1;font-size:14px;font-weight:700;color:var(--ink)}
.kv{display:grid;grid-template-columns:72px minmax(0,1fr);gap:7px 12px;font-size:14px;line-height:1.45}
.kv > b{font-size:12.5px;font-weight:650;color:var(--ink-3);padding-top:1px}
.kv > div{min-width:0;overflow-wrap:anywhere}
.ck-row{flex-wrap:wrap}.ck-row .row-t,.ck-row .row-l{flex:1;min-width:150px;display:grid;gap:2px;color:inherit;text-decoration:none}
.ck-row .row-t span{color:var(--ink-2);font-size:13px;display:flex;align-items:center;gap:5px}.ck-row .row-t span svg{width:13px;height:13px}
.cks{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto;align-items:center}
.ckc{display:inline-flex;align-items:center;gap:5px;height:28px;padding:0 10px;border-radius:8px;font:600 12px/1 inherit;font-family:inherit;cursor:pointer;border:1px solid var(--line);background:var(--field);color:var(--ink-3)}
.ckc svg{width:12px;height:12px}
.ckc.ok{color:color-mix(in srgb,var(--ok) 85%,var(--ink));background:color-mix(in srgb,var(--ok) 14%,transparent);border-color:color-mix(in srgb,var(--ok) 34%,transparent)}
.ckc.bad{color:color-mix(in srgb,var(--danger) 85%,var(--ink));background:color-mix(in srgb,var(--danger) 14%,transparent);border-color:color-mix(in srgb,var(--danger) 34%,transparent)}
.ck-sum{display:flex;gap:12px;align-items:center;padding:12px 14px;border-radius:var(--r-lg);margin-bottom:12px}
.ck-sum>svg{width:18px;height:18px;flex:none;color:var(--ink-3)}.ck-sum.ok>svg{color:var(--ok)}.ck-sum.bad>svg{color:var(--danger)}
.ck-sum div{display:grid;gap:2px}.ck-sum span{color:var(--ink-2);font-size:13px}
.linkish{background:none;border:0;padding:0;font:inherit;color:inherit;text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px;cursor:pointer}
.longbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:0 0 14px;padding:12px 14px;border-radius:var(--r-lg);background:color-mix(in srgb,var(--warn) 12%,var(--glass));border:1px solid color-mix(in srgb,var(--warn) 34%,transparent)}
.longbar>svg{width:20px;height:20px;flex:none;color:var(--warn)}
.longbar .lb-t{flex:1;min-width:180px;display:grid;gap:2px}.longbar .lb-t span{color:var(--ink-2);font-size:13px}
.longbar .lb-a{display:flex;gap:8px;flex-wrap:wrap}
.nc-step{display:grid;grid-template-columns:28px 1fr;gap:10px 12px;align-items:start;padding:12px;border-radius:var(--r-md,10px);border:1px solid var(--line);background:var(--field);margin-bottom:10px}
.nc-step .nc-n{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:13px;background:color-mix(in srgb,var(--dawn) 20%,transparent);color:var(--ink)}
.nc-step.done .nc-n{background:color-mix(in srgb,var(--ok) 26%,transparent)}.nc-step .nc-n svg{width:14px;height:14px}
.nc-step p{margin:3px 0 0;color:var(--ink-2);font-size:13px;line-height:1.4}
.nc-step .nc-b{grid-column:2;display:flex;gap:8px;flex-wrap:wrap}
.nc-pre{white-space:pre-wrap;word-break:break-word;font:12px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--ink-2);background:var(--field);border:1px solid var(--line);border-radius:var(--r-sm);padding:10px 12px;margin:4px 0 0;max-height:240px;overflow:auto;user-select:text;-webkit-user-select:text}
.nextbox{padding:9px 11px;border-radius:var(--r-sm);background:color-mix(in srgb,var(--dawn) 10%,transparent);border:1px solid color-mix(in srgb,var(--dawn) 22%,transparent)}
.why{display:grid;gap:4px;margin:8px 0 2px;font-size:14px;color:var(--ink-2)}
.why li{list-style:none;display:flex;gap:7px;align-items:baseline}
.why li::before{content:'•';color:var(--ink-3)}
.tl{display:grid}
.tl-r{display:grid;grid-template-columns:86px 64px minmax(0,1fr);gap:10px;padding:7px 0;font-size:14px;align-items:baseline}
.tl-r + .tl-r{border-top:1px solid var(--line)}
.tl-r code{color:var(--ink-2)}
.tl-r span{color:var(--ink-3);font-size:13px}
@media (max-width:520px){.tl-r{grid-template-columns:70px minmax(0,1fr)}.tl-r span{display:none}}
.det-sec{border-radius:var(--r-lg);overflow:hidden}
.det-sec > summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:8px;padding:13px 14px;font-weight:700;font-size:15px}
.det-sec > summary::-webkit-details-marker{display:none}
.det-sec > summary .chev{width:14px;height:14px;color:var(--ink-3);transform:rotate(-90deg);transition:transform .2s}
.det-sec[open] > summary .chev{transform:none}
.det-sec > summary small{margin-left:auto}
.det-sec > .pbody{padding:0 12px 12px}
.sect-t{font-size:15px;font-weight:700;margin:4px 2px -4px}

/* rows inside cards (links, setup, playbook) */
.row{display:flex;align-items:center;gap:10px;min-height:44px;padding:6px 0}
.row + .row{border-top:1px solid var(--line)}
.row-t{flex:1;min-width:0}
.row-t b{display:block;font-weight:620;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row-t span{display:flex;align-items:center;gap:5px;color:var(--ink-3);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row-t span svg{width:12px;height:12px;flex:none;color:var(--dawn)}
.row > svg{width:15px;height:15px;color:var(--ink-3);flex:none}
.row .li{width:30px;height:30px;border-radius:8px;background:var(--field);display:grid;place-items:center;flex:none;color:var(--ink-2)}
.row .li svg{width:15px;height:15px}
.row.off{opacity:.55}
.row code{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
.row .where{color:var(--ink-2);font-size:13px;flex:none}
.ck{display:flex;align-items:flex-start;gap:10px;padding:10px 0}
.ck + .ck{border-top:1px solid var(--line)}
.ck-i{width:22px;height:22px;border-radius:6px;display:grid;place-items:center;flex:none;margin-top:1px}
.ck-i svg{width:13px;height:13px}
.ck-i.pass{background:color-mix(in srgb,var(--ok) 20%,transparent);color:var(--ok)}
.ck-i.fix{background:color-mix(in srgb,var(--danger) 18%,transparent);color:var(--danger)}
.ck-i.unk{background:var(--field);color:var(--ink-3)}
.ck-t{flex:1;min-width:0;display:grid;gap:4px}
.ck-t > b{font-weight:650}
.ck-f{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:14px;color:var(--ink-2)}
.ck-f span{flex:1;min-width:160px}
.notes-ul{margin-left:18px;display:grid;gap:5px;line-height:1.45}
.hint-s{display:flex;align-items:center;gap:6px;color:var(--ink-3);font-size:12px;margin-top:8px}
.hint-s svg{width:12px;height:12px}
.foot-a{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;padding:4px 0}

/* ---------- groups + chat cards (project Chats tab) ---------- */
.secs,.subs{display:grid;gap:12px;grid-template-columns:minmax(0,1fr)}
.subs{gap:8px;padding:4px 8px 6px 12px}
.subs:empty{display:none}
.sec{--c:var(--ink-3);border-radius:var(--r-lg);padding:4px 0 8px}
.sec.sub{background:var(--field);border:1px solid var(--line);border-radius:var(--r-md);box-shadow:none;padding:2px 0 6px}
.sec-h{display:flex;align-items:center;gap:8px;padding:6px 8px 4px 6px}
.grip{width:22px;margin-right:-4px;height:36px;display:grid;place-items:center;color:var(--ink-3);touch-action:none;cursor:grab;flex:none}
.grip svg{width:16px;height:16px}
.gicon{width:30px;height:30px;min-width:30px;border-radius:8px;display:grid;place-items:center;font-size:16px;line-height:1;overflow:hidden;flex:none;
  background:color-mix(in srgb,var(--c) 22%,transparent);color:var(--c)}
.gicon svg{width:16px;height:16px}
.sub .gicon{width:24px;height:24px;min-width:24px;border-radius:6px;font-size:13px}
.sec-name{flex:1;min-width:0;display:flex;align-items:center;gap:8px;height:36px;text-align:left;font-size:15px;font-weight:700}
.sub .sec-name{font-size:14px;font-weight:650}
.sec-name span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sec-name small{font-size:11px;font-weight:700;color:var(--ink-2);background:var(--hi);border-radius:5px;padding:1px 6px;flex:none}
.sec-name .chev{width:14px;height:14px;color:var(--ink-3);transition:transform .25s;flex:none}
.sec.closed > .sec-h .chev{transform:rotate(-90deg)}
.sec.closed > .chat-list,.sec.closed > .subs{display:none}
.proj-btn{width:30px;height:30px;border-radius:var(--r-sm);display:grid;place-items:center;color:var(--c);flex:none}
.proj-btn svg{width:16px;height:16px}
.chat-list{display:grid;gap:6px;padding:4px 8px 4px;min-height:8px}
.chat-list.bare:empty{min-height:48px;margin:2px 8px 4px;padding:0;border:1.5px dashed var(--line);border-radius:var(--r-sm)}
.chat-list.bare:empty::before{content:'Drag chats here';display:grid;place-items:center;height:44px;color:var(--ink-3);font-size:13px}
.chat{--c:var(--dawn);display:flex;align-items:stretch;border-radius:var(--r-md);overflow:hidden;background:var(--field);
  border:1px solid color-mix(in srgb,var(--c) 22%,var(--line));box-shadow:inset 3px 0 0 var(--c);
  -webkit-touch-callout:none;user-select:none;-webkit-user-select:none;transition:transform .15s,border-color .2s}
.chat:active{transform:scale(.99)}
.chat-main{flex:1;min-width:0;display:flex;align-items:center;gap:10px;min-height:52px;padding:7px 6px 7px 2px;text-align:left}
.kic{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;flex:none;background:color-mix(in srgb,var(--c) 20%,transparent);color:var(--c)}
.kic svg{width:15px;height:15px}
.txt{min-width:0;flex:1}
.txt b{display:block;font-weight:620;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.txt small{display:block;color:var(--ink-3);font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:1px}
.pinmark{width:6px;height:6px;border-radius:50%;background:var(--dawn);display:inline-block;margin-left:6px;vertical-align:middle}
.go{width:46px;display:grid;place-items:center;flex:none;color:var(--c);border-left:1px solid var(--line)}
.go span{width:30px;height:30px;border-radius:var(--r-sm);display:grid;place-items:center;background:color-mix(in srgb,var(--c) 18%,transparent)}
.go svg{width:15px;height:15px}
.go.none{color:var(--ink-3)}
.go.none span{background:var(--field)}
.chat .grip{width:26px;height:auto;align-self:stretch;margin-left:3px}
.chat.sel{border-color:var(--c);box-shadow:inset 3px 0 0 var(--c),0 0 0 2px color-mix(in srgb,var(--c) 40%,transparent)}
@media (hover:hover){.chat:hover{border-color:color-mix(in srgb,var(--c) 50%,var(--line))}.go:hover span{background:color-mix(in srgb,var(--c) 32%,transparent)}}
.step-tag,.home-tag,.rn-tag{font-style:normal;display:inline-flex;align-items:center;gap:3px;margin-left:7px;padding:0 6px;height:17px;border-radius:5px;background:var(--hi);color:var(--ink-2);font-size:10.5px;font-weight:700;vertical-align:2px}
.step-tag svg{width:9px;height:9px}
.home-tag{color:var(--dawn);background:color-mix(in srgb,var(--dawn) 18%,transparent)}
.rn-tag{color:color-mix(in srgb,var(--warn) 85%,var(--ink));background:color-mix(in srgb,var(--warn) 16%,transparent)}
.sec.glass,.dcard.glass{background:linear-gradient(180deg,color-mix(in srgb,var(--c) 9%,var(--card)),var(--card));border-color:color-mix(in srgb,var(--c) 24%,var(--line2))}

/* drag feedback + archive dock */
.s-ghost{opacity:.3}
.sortable-fallback{opacity:1!important;border-radius:var(--r-md);box-shadow:0 18px 40px var(--shadow)!important;scale:1.03;transition:scale .2s,opacity .2s;background:var(--sheet)}
body.hot-archive .sortable-fallback{scale:.55;opacity:.55!important}
.dock{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 22px);z-index:65;display:flex;align-items:center;gap:12px;
  padding:10px 20px 10px 12px;border-radius:14px;background:var(--sheet);border:1px solid var(--line);
  -webkit-backdrop-filter:blur(24px);backdrop-filter:blur(24px);box-shadow:0 16px 40px var(--shadow);
  transform:translate(-50%,160%);opacity:0;pointer-events:none;font-weight:650;white-space:nowrap;
  transition:transform .4s cubic-bezier(.34,1.4,.5,1),opacity .25s,background .2s,border-color .2s}
body.dragging .dock,body.archiving .dock{transform:translate(-50%,0);opacity:1}
.dock.hot{transform:translate(-50%,0) scale(1.12);background:color-mix(in srgb,var(--dawn) 26%,var(--sheet));border-color:var(--dawn)}
.bin{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;background:var(--hi);color:var(--dawn)}
.bin svg{width:24px;height:24px;overflow:visible}
.bin .lid{transform-box:fill-box;transform-origin:0% 100%;transition:transform .35s cubic-bezier(.34,1.8,.5,1)}
.dock.hot .lid{transform:rotate(-32deg) translate(-1px,-3px)}
.dock .t2{display:none}.dock.hot .t1{display:none}.dock.hot .t2{display:inline}
.dock.gulp .bin{animation:gulp .6s cubic-bezier(.34,1.6,.5,1)}
@keyframes gulp{0%{transform:scale(1)}25%{transform:scale(.72) rotate(-6deg)}60%{transform:scale(1.18) rotate(4deg)}100%{transform:scale(1)}}
body.dragging{user-select:none;-webkit-user-select:none}
.drop-hint{position:fixed;inset:12px;border:2px dashed var(--dawn);border-radius:18px;display:grid;place-items:center;z-index:70;
  background:color-mix(in srgb,var(--night) 70%,transparent);font-size:20px;font-weight:650;pointer-events:none}

/* flat lists (archive, search) */
.flat{border-radius:var(--r-lg);padding:6px 10px;display:grid;gap:6px}
.arch-row{display:flex;align-items:center;gap:6px;padding:8px 2px}
.arch-row + .arch-row{border-top:1px solid var(--line)}
.arch-row > button:first-child,.arch-row > div:first-of-type{flex:1;min-width:0;text-align:left}
.arch-row b{display:block;font-weight:560;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.arch-row .gicon{--c:var(--ink-3)}
.arch-h{font-size:14px;font-weight:700;margin:4px 2px 0}
.empty{border-radius:var(--r-lg);padding:24px 20px;text-align:center;display:grid;gap:10px;justify-items:center}
.empty h2{font-size:17px}
.empty p{color:var(--ink-2);max-width:40ch}
.banner{display:flex;align-items:center;gap:10px;padding:10px 10px 10px 14px;border-radius:var(--r-md);margin-bottom:16px;border-color:var(--dawn)}
.banner b{flex:1;font-weight:600;font-size:14px}
.banner .x{width:30px;height:30px;color:var(--ink-3);font-size:19px;border-radius:var(--r-sm)}

/* chat detail (page on phone, side panel on computer) */
.hero{--c:var(--dawn);border-radius:var(--r-lg);padding:16px;margin-bottom:12px;position:relative;overflow:hidden}
.hero::before{content:'';position:absolute;inset:0;background:radial-gradient(90% 80% at 0% 0%,color-mix(in srgb,var(--c) 18%,transparent),transparent 70%);pointer-events:none}
.hero > *{position:relative}
.crumbs{display:flex;align-items:center;gap:8px;flex-wrap:wrap;color:var(--ink-2);font-size:13px;font-weight:600;margin-bottom:8px}
.tag{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 9px;border-radius:6px;background:color-mix(in srgb,var(--c) 20%,transparent);color:var(--c)}
.tag svg{width:13px;height:13px}
.title-inp{width:100%;font-size:22px;font-weight:750;letter-spacing:-.02em;padding:4px 0;border-bottom:1px solid transparent}
.title-inp:focus{border-bottom-color:var(--line)}
.open-big{display:flex;align-items:center;justify-content:center;gap:8px;height:46px;border-radius:var(--r-md);background:var(--c);color:#111;font-weight:700;font-size:15px;margin-top:12px}
.open-big svg{width:18px;height:18px}
.open-big.none{background:var(--field);color:var(--ink-2)}
.hero-actions{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.card{border-radius:var(--r-lg);padding:14px;margin-bottom:12px}
.card-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.card-h h3{font-size:14px;font-weight:700}
.saved{font-size:12px;color:var(--ok);opacity:0;transition:opacity .3s}
.saved.on{opacity:1}

    -webkit-backdrop-filter:blur(26px) saturate(1.4);backdrop-filter:blur(26px) saturate(1.4);box-shadow:0 20px 50px var(--shadow);animation:panelIn .3s cubic-bezier(.2,.9,.2,1)}

/* ---------- sheet ---------- */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.42);opacity:0;pointer-events:none;transition:opacity .3s;z-index:40}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;max-width:620px;margin:0 auto;max-height:90vh;overflow:auto;z-index:41;
  padding:10px 20px calc(env(safe-area-inset-bottom) + 24px);border-radius:16px 16px 0 0;
  background:var(--sheet);-webkit-backdrop-filter:blur(26px) saturate(1.4);backdrop-filter:blur(26px) saturate(1.4);
  border:1px solid var(--line);border-bottom:0;transform:translateY(105%);transition:transform .42s cubic-bezier(.2,.9,.2,1.02)}

.sheet.on{transform:none}
@media (min-width:900px){
  .sheet{top:50%;bottom:auto;left:50%;right:auto;width:min(560px,90vw);max-height:84vh;border-radius:14px;border-bottom:1px solid var(--line);padding:18px 22px 22px;
    transform:translate(-50%,-46%) scale(.98);opacity:0;transition:transform .25s cubic-bezier(.2,.9,.2,1),opacity .2s;box-shadow:0 30px 80px var(--shadow)}
  .sheet:not(.on){transition:transform .2s,opacity .2s,visibility 0s .2s}
  .sheet.on{transform:translate(-50%,-50%);opacity:1}
  .grab{display:none}
}
.grab{width:38px;height:5px;border-radius:3px;background:var(--ink-3);margin:0 auto 14px;opacity:.6;position:relative;cursor:pointer}
.grab::before{content:'';position:absolute;inset:-14px -40px}

html{touch-action:manipulation;-webkit-text-size-adjust:100%;text-size-adjust:100%}

.sheet h2{font-size:20px;font-weight:720;letter-spacing:-.01em;margin-bottom:12px}

.chip.on{background:var(--dawn);border-color:var(--dawn);color:var(--dawn-ink)}
.picker{display:grid;gap:2px;max-height:250px;overflow:auto;background:var(--field);border:1px solid var(--line);border-radius:var(--r-sm);padding:5px}
.pick{--c:var(--ink-3);display:flex;align-items:center;gap:8px;min-height:38px;padding:0 10px;border-radius:7px;text-align:left;font-weight:560;color:var(--ink-2)}
.pick .gicon{width:24px;height:24px;min-width:24px;border-radius:6px;font-size:13px}
.pick > svg{width:16px;height:16px;flex:none}
.pick.on{background:var(--dawn);color:var(--dawn-ink)}
.pick.on .gicon{background:rgba(0,0,0,.12);color:inherit}
.swatches{display:flex;flex-wrap:wrap;gap:10px}
.sw{width:34px;height:34px;border-radius:9px;background:var(--c);border:3px solid transparent;box-shadow:0 0 0 1px var(--line)}
.sw.none{background:var(--field);display:grid;place-items:center;color:var(--ink-3);font-size:17px}
.sw.on{border-color:var(--ink)}
.emojis{display:grid;grid-template-columns:repeat(auto-fill,minmax(40px,1fr));gap:6px}
.emo{height:40px;border-radius:9px;background:var(--field);font-size:20px;border:2px solid transparent}

.btn{width:100%;height:44px;border-radius:var(--r-md);background:var(--dawn);color:var(--dawn-ink);font-weight:680;font-size:15px;margin-top:6px;display:flex;align-items:center;justify-content:center;gap:8px}
.btn.ghost{background:var(--field);color:var(--ink);border:1px solid var(--line)}
.btn.warn{background:var(--field);color:var(--danger);border:1px solid var(--line)}
.btn:disabled{opacity:.5}
.btn + .btn{margin-top:8px}
.btn svg{width:18px;height:18px;flex:none}
.imp-list,.upd{max-height:320px;overflow:auto;background:var(--field);border:1px solid var(--line);border-radius:var(--r-sm);padding:10px 12px;margin:10px 0 4px}
.imp-list h4,.upd h4{font-size:13px;color:var(--ink-2);margin:10px 0 4px}
.imp-list h4:first-child,.upd h4:first-child{margin-top:0}
.imp-list div,.upd div{font-size:14px;padding:2px 0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.paste{height:64px;font-size:17px}
.paste svg{width:22px;height:22px}
.or{text-align:center;color:var(--ink-3);font-size:13px;margin:12px 0 8px}
.err{color:var(--danger);font-size:14px;margin:8px 2px 0;min-height:1em}
.linklike{display:block;margin:14px auto 0;color:var(--ink-2);font-weight:600;font-size:14px;text-decoration:underline;text-underline-offset:3px}

.pick-list{display:grid;gap:6px}

.pick-row b{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.ta-h{display:flex;align-items:center;gap:8px}

/* tooltip: replaces the browser's plain title box on computer */

const SMALL = new Set('a an and as at but by for in nor of on or per the to vs via with'.split(' '));
function tc(t) {

    const m = w.match(/^([^a-z]*)([a-z])(.*)$/s);

const UUID_RE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i;
const U = '[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}';
// Turns anything pasted into { kind, chat_uuid, url } or { error }.
function parseLink(text) {
  const t = String(text || '').trim().split(/\s+/)[0] || '';
  if (!t) return { error: 'Nothing to paste. Copy a link first.' };
  if (/claude\.ai\/share\//i.test(t)) return { error: "That's a share link, which is a public snapshot. Copy the chat's own link (claude.ai/chat/…) instead." };
  let m = t.match(new RegExp(`claude\\.ai/chat/(${U})`, 'i'));
  if (m) return { kind: 'chat', chat_uuid: m[1].toLowerCase(), url: null };
  if (UUID_RE.test(t)) return { kind: 'chat', chat_uuid: t.toLowerCase(), url: null };
  m = t.match(new RegExp(`claude\\.ai/project/(${U})`, 'i'));
  if (m) return { kind: 'project', chat_uuid: null, url: `https://claude.ai/project/${m[1].toLowerCase()}` };
  m = t.match(/^(?:https:\/\/claude\.ai|claude:\/\/(?:claude\.ai)?)\/?code\/([A-Za-z0-9_-]{6,})/i);
  if (m && m[1].toLowerCase() !== 'new') return { kind: 'code', chat_uuid: null, url: `https://claude.ai/code/${m[1]}` };
  if (/^(https:\/\/claude\.ai\/|claude:\/\/)/i.test(t)) {
    const url = t.replace(/^claude:\/\/claude\.ai\//i, 'https://claude.ai/').slice(0, 500);
    return { kind: /cowork/i.test(t) ? 'cowork' : 'other', chat_uuid: null, url };
  }
  return { error: "That isn't a Claude link. It should start with claude.ai/ or claude://" };
}

async function api(path, opts = {}) {

    headers: { 'Content-Type': 'application/json', 'X-App-Version': APP_VERSION, ...(S.token ? { Authorization: 'Bearer ' + S.token } : {}) },
    body: opts.body ? JSON.stringify(opts.body) : undefined,
    keepalive: !!opts.keepalive,
  });
  let j = {};
  try { j = await res.json(); } catch {}
  if (res.status === 401 && path !== '/api/login') { signOut(j.error); throw new Error(j.error || 'Signed out.'); }

  return j;
}

function renderMain() {

  S.homeIds = null;
  const s = S.route === 'project' ? secById(S.pid) : null;
  if (S.filter) el.innerHTML = searchHTML();

// ---------- setup checks (threads-18) ----------
// Per env var: set in Vercel? saved in 1Password? Per account: saved in 1Password? true / false / not checked.
const triV = (v) => (v === true || /^(yes|true|confirmed|ok|set)$/i.test(String(v ?? '')) ? true : v === false || /^(no|false|missing)$/i.test(String(v ?? '')) ? false : null);
function ckFields(x, keys) {
  const o = {};
  for (const k of keys) { const t = triV(x?.[k]); if (t !== null) o[k] = t; }
  if (/^\d{4}-\d{2}-\d{2}$/.test(String(x?.checked || ''))) o.checked = String(x.checked);
  return o;
}
function carryChecks(oldL, newL, keys) {
  const m = new Map((Array.isArray(oldL) ? oldL : []).map((e) => [String(e?.name || '').toLowerCase(), e]));
  return (Array.isArray(newL) ? newL : []).map((e) => {
    const o = m.get(String(e?.name || '').toLowerCase());
    if (!o || !e || typeof e !== 'object') return e;
    const x = { ...e };
    for (const k of [...keys, 'checked']) if (!(k in x) && k in o) x[k] = o[k];
    return x;
  });
}
const CK = { vercel: ['Vercel', 'Set in Vercel'], op: ['1Password', 'Saved in 1Password'] };
function ckChip(s, list, i, k, v) {
  const st = v === true ? 'ok' : v === false ? 'bad' : 'unk';
  const tip = `${CK[k][1]}: ${st === 'ok' ? 'confirmed' : st === 'bad' ? 'missing' : 'not checked yet'}. Tap to change.`;
  return `<button class="ckc ${st}" data-act="ck" data-id="${s.id}" data-l="${list}" data-i="${i}" data-k="${k}" title="${esc(tip)}" aria-label="${esc(tip)}">${st === 'ok' ? ICON.check : st === 'bad' ? ICON.x : ICON.dash}${CK[k][0]}</button>`;
}
// Counts every check (env: Vercel + 1Password, accounts: 1Password).
function setupChecks(s) {
  const d = normDoc(s), r = { ok: 0, bad: 0, unk: 0, total: 0 };
  const add = (v) => { r.total++; r[v === true ? 'ok' : v === false ? 'bad' : 'unk']++; };
  d.env.forEach((e) => { add(e.vercel); add(e.op); });
  d.accounts.forEach((a) => add(a.op));

}
const ckSummary = (r) => (r.total ? `${r.ok} of ${r.total} confirmed${r.bad ? ` · ${r.bad} missing` : ''}` : '');
function toggleCheck(id, list, i, k) {
  const s = secById(id), d = normDoc(s), arr = (d[list] || []).map((x) => ({ ...x })), it = arr[+i];
  if (!it) return;
  const cur = triV(it[k]);
  it[k] = cur === null ? true : cur === true ? false : null; // not checked → confirmed → missing → not checked
  // null (not deleted) so carryChecks doesn't bring the old value back; the server drops nulls when it saves.
  it.checked = nowISO().slice(0, 10);
  setDoc(s, { [list]: arr }, true);
  toast(`${it.name}: ${CK[k][1].toLowerCase()} ${it[k] === true ? 'confirmed' : it[k] === false ? 'marked missing' : 'not checked'}`);
}

(() => {

  let y0 = null, dy = 0, drag = false;
  sh.addEventListener('touchstart', (e) => {
    if (wide() || !sh.classList.contains('on') || e.touches.length > 1) { y0 = null; return; }
    if (sh.scrollTop > 0 && !e.target.closest('.grab')) { y0 = null; return; }
    y0 = e.touches[0].clientY; dy = 0; drag = false;
  }, { passive: true });
  sh.addEventListener('touchmove', (e) => {
    if (y0 === null) return;
    dy = e.touches[0].clientY - y0;
    if (!drag && dy < 0) { y0 = null; return; } // scrolling up inside the sheet
    if (dy > 6 && sh.scrollTop <= 0) {
      drag = true; e.preventDefault();
      sh.classList.add('dragging');
      sh.style.transform = `translateY(${dy}px)`;
      $('#scrim').style.opacity = String(Math.max(0, 1 - dy / 400));
    }
  }, { passive: false });
  const end = () => {
    if (y0 === null) return;
    sh.classList.remove('dragging');
    if (drag && dy > 110) closeSheet();
    else { sh.style.transform = ''; $('#scrim').style.opacity = ''; }
    y0 = null; drag = false;
  };
  sh.addEventListener('touchend', end); sh.addEventListener('touchcancel', end);
})();

const splitPath = (g) => String(g || '').split(/\s*[›>]\s*/).map((x) => x.trim().slice(0, 80)).filter(Boolean);
function openImport() {

function parseImport(text) {
  const t = String(text || '').trim();
  if (!t) return { error: 'Nothing to import yet.' };
  const a = t.indexOf('{'), b = t.lastIndexOf('}');
  if (a < 0 || b < a) return { error: "That doesn't look like a Threads import. It should start with {" };
  let j;
  try { j = JSON.parse(t.slice(a, b + 1)); } catch { return { error: "Couldn't read that. Make sure you copied all of it, from the first { to the last }." }; }
  if (j.threads_sync) return parseSync(j);
  if (j.threads_project) return parseProjectUpdate(j);
  const raw = Array.isArray(j.items) ? j.items : [];
  if (!raw.length) return { error: 'No items found in that list.' };
  const meta = {};
  (Array.isArray(j.groups) ? j.groups : []).forEach((g) => { if (g?.path) meta[splitPath(g.path).join(' › ').toLowerCase()] = { icon: g.icon ? String(g.icon).slice(0, 16) : null, color: COLORS.includes(g.color) ? g.color : null }; });
  const seen = new Set(), items = [], skipped = [], bad = [];
  for (const it of raw) {
    const name = String(it?.name || '').trim().slice(0, 80) || 'Untitled';
    const p = it?.link ? parseLink(it.link) : { kind: KIND[it?.kind] ? it.kind : 'cowork', chat_uuid: null, url: null, none: true };
    if (p.error) { bad.push(name); continue; }
    const key = p.chat_uuid || p.url;
    if (key && seen.has(key)) continue;
    if (key) seen.add(key);
    if (!p.none && S.chats.some((c) => sameItem(c, p))) { skipped.push(name); continue; }
    items.push({ name, p, path: splitPath(it.group), notes: String(it.notes || '').slice(0, 20000),
      todos: (Array.isArray(it.todos) ? it.todos : []).map((x) => String(x).trim().slice(0, 300)).filter(Boolean).slice(0, 50),
      archived: !!it.archived, pinned: !!it.pinned });
  }
  return { items, skipped, bad, meta };
}
// Finds each group by name (case doesn't matter), or plans a new one.
function resolvePath(parts, plan) {
  if (!parts.length) return inbox().id;
  let parent = null, key = '';
  for (const name of parts) {
    key = key ? `${key} › ${name.toLowerCase()}` : name.toLowerCase();
    if (plan.map[key]) { parent = plan.map[key]; continue; }
    const hit = children(parent, true).find((s) => s.name.toLowerCase() === name.toLowerCase());
    if (hit) { plan.map[key] = hit.id; parent = hit.id; continue; }
    const m = plan.meta[key] || {};
    const row = { id: uid(), name, parent_id: parent, position: children(parent, true).length + plan.rows.filter((r) => r.parent_id === parent).length,
      color: m.color || (parent ? null : COLORS[plan.colorIdx++ % COLORS.length]), icon: m.icon || null, project_uuid: null, archived_at: null, status: 'hold', doc: {}, created_at: nowISO() };
    plan.rows.push(row); plan.map[key] = row.id; parent = row.id;

}

function parseProjectUpdate(j) {

  if (!s) return { error: `There's no project called "${j.project || '?'}" in Threads. Check the name, or add the group first.` };
  const { patch, dropped } = docFields(j);
  for (const k of Object.keys(patch)) if ((Array.isArray(patch[k]) && !patch[k].length) || patch[k] === '') delete patch[k];

// Cleans project doc fields from Claude: never passwords, keys or env values.

  if ('next' in j) patch.next = str(j.next, 400);

  if (Array.isArray(j.notes)) patch.notes = j.notes.map((x) => str(x, 300)).filter(Boolean).slice(0, 30);
  if (Array.isArray(j.tools)) patch.tools = j.tools.slice(0, 40).map((t) => {
    if (typeof t === 'string') return { name: str(t, 60), role: '', url: '' };
    scan(t, ['name', 'role', 'url']);
    return { name: str(t?.name, 60), role: str(t?.role, 120), url: URL_OK(t?.url) ? str(t.url, 500) : '' };
  }).filter((t) => t.name);
  if (Array.isArray(j.accounts)) patch.accounts = j.accounts.slice(0, 40).map((x) => {
    scan(x, ['name', 'item', 'vault', 'link']);
    return { name: str(x?.name, 80), item: str(x?.item, 120), vault: str(x?.vault, 60), link: OP_OK(x?.link) ? str(x.link, 600) : '', ...ckFields(x, ['op']) };

}

function previewImport(text) {

function runImport() {

  const next = {};

document.addEventListener('click', (ev) => {
  if (ev.target.id === 'scrim') return closeSheet();
  const el = ev.target.closest('[data-act]');
  if (el && A[el.dataset.act]) A[el.dataset.act](el, ev);
});
document.addEventListener('submit', (ev) => { if (ev.target.id === 'login-form') login(ev); });
document.addEventListener('input', (ev) => {
  const t = ev.target;
  if (t.classList.contains('filter-inp')) {
    const was = !!S.filter;
    S.filter = t.value.trim();
    if (was !== !!S.filter) renderTop();
    renderContent(); return;
  }
  if (t.id === 'add-text' || t.id === 'link-text') {
    const v = t.value.trim(), err = $(t.id === 'add-text' ? '#add-err' : '#link-err');
    if (!v) { err.textContent = ''; return; }
    const r = parseLink(v);
    if (r.error) { err.textContent = r.error; return; }
    return t.id === 'add-text' ? showAddForm(r) : applyLink(t.dataset.id, v);
  }
  if (t.id === 'de-now' || t.id === 'de-next') counts();
  if (t.id === 'g-icon-custom' && t.value.trim()) $$('#g-icon .emo').forEach((b) => b.classList.remove('on'));
  const c = (S.view === 'detail' || S.panel) && chatById(S.detailId);
  if (!c) return;
  if (t.id === 'd-name' && t.value.trim()) { c.name = t.value.trim().slice(0, 80); queueSave(c.id, { name: c.name }); }
  if (t.id === 'd-notes') { c.notes = t.value; autosize(); queueSave(c.id, { notes: c.notes }); }
  if (t.classList.contains('todo-text')) {
    const td = c.todos.find((x) => x.id === t.dataset.tid);
    if (td) { td.text = t.value; queueSave(c.id, { todos: c.todos }); }
  }
});
document.addEventListener('change', (ev) => {
  if (ev.target.id === 'imp-file') {
    const f = ev.target.files?.[0];
    if (!f) return;
    const rd = new FileReader();
    rd.onload = () => { $('#imp-text').value = rd.result; previewImport(rd.result); };
    rd.readAsText(f);
    return;
  }
  if (ev.target.id !== 'd-pin') return;
  const c = chatById(ev.target.dataset.id), on = ev.target.checked;
  c.pinned = on; c.pin_position = on ? pins().filter((x) => x.id !== c.id).length : null;
  const rows = [{ id: c.id, pinned: on, pin_position: c.pin_position }, ...(on ? [] : renumber(pins(), 'pin_position'))];
  toast(on ? 'Pinned' : 'Unpinned');
  push([{ op: 'patch', table: 'chats', rows }]);
});
document.addEventListener('focusout', (ev) => {
  if (ev.target.id === 'd-name' && !ev.target.value.trim()) ev.target.value = chatById(S.detailId)?.name || '';
});
document.addEventListener('keydown', (ev) => {
  const mod = ev.metaKey || ev.ctrlKey;
  const typing = /INPUT|TEXTAREA|SELECT/.test(document.activeElement?.tagName || '');
  if (S.token && mod && ev.key.toLowerCase() === 'k') {
    ev.preventDefault();
    if (S.view === 'detail') backToMain();
    closeSheet();
    const f = wide() ? $('#filter') : ($('#filter-m') || (go('home'), $('#filter-m')));
    f?.focus(); f?.select(); return;
  }
  if (S.token && ((mod && ev.key.toLowerCase() === 'n') || (!mod && !typing && ev.key === 'n' && !$('#sheet').classList.contains('on')))) {
    ev.preventDefault(); openAdd(); return;
  }
  if (ev.key === 'Escape') {
    if ($('#sheet').classList.contains('on')) closeSheet();
    else if (S.panel) closePanel();
    else if (document.activeElement?.classList.contains('filter-inp') && S.filter) { clearFilter(); }
    else if (S.view !== 'main') backToMain();
    else if (S.hfilter) { S.hfilter = ''; renderContent(); }
    else if (!/INPUT|TEXTAREA/.test(document.activeElement?.tagName || '') && ['project', 'archive', 'triage', 'group'].includes(S.route)) goBack();
  }
  if (ev.key !== 'Enter') return;
  const id = ev.target.id;
  if (id === 'todo-new') {
    ev.preventDefault();
    const text = ev.target.value.trim(), c = chatById(S.detailId);
    if (!text || !c) return;
    c.todos = [...(c.todos || []), { id: uid().slice(0, 8), text: text.slice(0, 300), done: false }];
    ev.target.value = ''; renderTodos(true); queueSave(c.id, { todos: c.todos }, 0);
  }
  if (id === 'd-name' || ev.target.classList.contains('todo-text')) { ev.preventDefault(); ev.target.blur(); }
  if (id === 'ac-name') { ev.preventDefault(); saveNew(); }
  if (id === 'g-name') { ev.preventDefault(); $('[data-act="g-save"]')?.click(); }
});

// Long-press is for dragging, so stop iOS link previews on cards.

// Remember which Playbook / Setup sections are open on iPhone.

// Switching between phone and Mac layouts (resizing the window)

  if (!S.token) return;

// ?add=<link> opens the add card (for a share-sheet Shortcut later)
function handleQuery() {
  const add = new URL(location.href).searchParams.get('add');
  if (!add || !S.token) return;
  history.replaceState(null, '', location.pathname);
  openAdd(add);

let lastLoad = Date.now();
document.addEventListener('visibilitychange', () => {
  if (document.hidden) return flushSaves();
  if (!S.token) return;

  if (Date.now() - lastLoad > 5e3) { lastLoad = Date.now(); load(); }
  checkClipboard(); checkVersion();
});

// ---------- tooltips ----------
// Hover a button for ~half a second to see a small styled hint. Mouse/trackpad only; skipped when the hint
// just repeats the button's visible label.
const tipEl = Object.assign(document.createElement('div'), { className: 'tip', role: 'tooltip' });
document.body.append(tipEl);
let tipFor = null, tipT = 0;
function hideTip() { clearTimeout(tipT); tipFor = null; tipEl.classList.remove('on'); }
function showTip(el) {
  if (!el.isConnected) return;
  tipEl.textContent = el.dataset.tip;
  const r = el.getBoundingClientRect(), w = tipEl.offsetWidth, h = tipEl.offsetHeight, vw = innerWidth, vh = innerHeight, m = 8;
  let x, y, ty = '3px';
  if (el.closest('.side') && document.body.classList.contains('rail')) { x = r.right + 10; y = r.top + r.height / 2 - h / 2; ty = '0'; }
  else { x = r.left + r.width / 2 - w / 2; y = r.bottom + 8; if (y + h > vh - m) { y = r.top - h - 8; ty = '-3px'; } }
  x = Math.max(m, Math.min(x, vw - w - m)); y = Math.max(m, Math.min(y, vh - h - m));
  tipEl.style.left = x + 'px'; tipEl.style.top = y + 'px'; tipEl.style.setProperty('--ty', ty);
  requestAnimationFrame(() => tipEl.classList.add('on'));
}
document.addEventListener('pointerover', (e) => {
  if (e.pointerType !== 'mouse') return;
  const el = e.target.closest?.('[title],[data-tip]');
  if (el === tipFor) return;
  hideTip();
  if (!el) return;
  if (el.hasAttribute('title')) {
    const t = el.getAttribute('title'); el.removeAttribute('title');
    if (!t) return;
    el.dataset.tip = t;
    if (!el.getAttribute('aria-label') && !el.textContent.trim()) el.setAttribute('aria-label', t);
  }
  const label = el.textContent.replace(/\s+/g, ' ').trim().toLowerCase(), tip = el.dataset.tip.toLowerCase();
  const railSide = el.closest('.side') && document.body.classList.contains('rail');
  if (!railSide && label && (tip === label || label.startsWith(tip))) return;
  tipFor = el; tipT = setTimeout(() => showTip(el), 450);
});
document.addEventListener('pointerout', (e) => { if (tipFor && !tipFor.contains(e.relatedTarget)) hideTip(); });
for (const ev of ['pointerdown', 'keydown', 'wheel']) document.addEventListener(ev, hideTip, { passive: true, capture: true });
addEventListener('scroll', hideTip, { passive: true, capture: true });
addEventListener('blur', hideTip);

// ---------- updates ----------
async function checkVersion() {
  try { const j = await (await fetch('/version.json', { cache: 'no-store' })).json(); if (j.version && j.version !== APP_VERSION) showUpdate(); } catch {}
}
function showUpdate() {
  S.updateReady = true;
  const b = $('#banner');
  if (b) b.innerHTML = `<div class="banner glass" data-act="reload" role="button" style="cursor:pointer"><b>Update ready · tap to reload</b><button class="add-btn" data-act="reload">Reload</button></div>`;
}

// ---------- sidebar width (drag the edge; drag far left for an icon rail) ----------
const SIDE_MIN = 210, SIDE_MAX = 420, RAIL_AT = 150, RAIL_W = 64;
let sideW = Math.min(SIDE_MAX, Math.max(SIDE_MIN, +localStorage.getItem('threads.sideW') || 264));
let rail = localStorage.getItem('threads.rail') === '1';
function applySide() { document.documentElement.style.setProperty('--side', (rail ? RAIL_W : sideW) + 'px'); document.body.classList.toggle('rail', rail); }
function setRail(on) { rail = on; applySide(); localStorage.setItem('threads.rail', rail ? '1' : ''); }
document.addEventListener('pointerdown', (e) => {
  if (!e.target.closest?.('.side-rz')) return;
  e.preventDefault();
  document.body.classList.add('resizing');
  const move = (ev) => {
    if (ev.clientX < RAIL_AT) { if (!rail) { rail = true; applySide(); } return; }
    rail = false; sideW = Math.min(SIDE_MAX, Math.max(SIDE_MIN, Math.round(ev.clientX))); applySide();
  };
  const up = () => {
    document.body.classList.remove('resizing');
    removeEventListener('pointermove', move); removeEventListener('pointerup', up);
    localStorage.setItem('threads.sideW', sideW); localStorage.setItem('threads.rail', rail ? '1' : '');
  };
  addEventListener('pointermove', move); addEventListener('pointerup', up);
});
document.addEventListener('dblclick', (e) => { if (e.target.closest?.('.side-rz')) setRail(!rail); });
applySide();

// ---------- iOS home-screen fixes (Holdfast, Oct 2026) ----------
const standalone = () => navigator.standalone || matchMedia('(display-mode: standalone)').matches;
function fixViewport() {
  const r = document.documentElement.style;
  if (!isIOS || !standalone()) { r.setProperty('--gap', '0px'); return; }
  r.setProperty('--topgap', '26px'); // iOS 27 blurs the top edge
  const probe = document.createElement('div');
  probe.style.cssText = 'position:fixed;inset:0;visibility:hidden;pointer-events:none';
  document.body.appendChild(probe);
  const land = innerWidth > innerHeight;
  const sh = land ? Math.min(screen.width, screen.height) : Math.max(screen.width, screen.height);
  const gap = sh - probe.getBoundingClientRect().height;
  probe.remove();
  r.setProperty('--gap', (gap > 0 && gap < 120 ? Math.round(gap) : 0) + 'px');
}
window.addEventListener('resize', fixViewport);
window.addEventListener('orientationchange', () => setTimeout(fixViewport, 300));

// ---------- boot ----------
applyTheme(S.theme);
fixViewport();
if (S.token) loadCache();
if (S.route === 'projects' && wide()) S.route = 'home';
render();
if (S.token) { load().then(() => { checkClipboard(); checkVersion(); }); handleQuery(); }

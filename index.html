<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d1424">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Threads">
<title>Threads</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icon-180.png">
<link rel="icon" type="image/png" href="/icon-192.png">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.2/Sortable.min.js"></script>
<style>
:root{
  --night:#0d1424; --night-2:#141d31;
  --ink:#eef2f8; --ink-2:#aab3c5; --ink-3:#6f7a91;
  --line:rgba(255,255,255,.09); --glass:rgba(255,255,255,.055);
  --sheet:rgba(21,30,51,.9); --bar:rgba(22,31,52,.72);
  --hi:rgba(255,255,255,.12); --field:rgba(255,255,255,.07); --shadow:rgba(3,6,15,.32);
  --dawn:#f2c46d; --dawn-ink:#1d1606; --danger:#ff6b61; --ok:#3ecf8e;
  --sky:rgba(90,165,255,.20); --sky2:rgba(120,200,255,.10);
  --r-lg:22px; --r-md:16px; --r-sm:12px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{min-height:100%}
body{font:16px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",system-ui,sans-serif;color:var(--ink);
  background:linear-gradient(180deg,var(--night),var(--night-2)) fixed;background-color:var(--night);
  -webkit-font-smoothing:antialiased;transition:background .6s,color .6s}
body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:-1;
  background:radial-gradient(120% 60% at 15% -10%,var(--sky),transparent 60%),radial-gradient(90% 50% at 100% 0%,var(--sky2),transparent 60%)}
button,input,select,textarea{font:inherit;color:inherit;background:none;border:0;outline:0}
button{cursor:pointer}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--dawn);outline-offset:2px}
[hidden]{display:none!important}
.glass{background:var(--glass);border:1px solid var(--line);
  -webkit-backdrop-filter:blur(22px) saturate(1.4);backdrop-filter:blur(22px) saturate(1.4);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 12px 32px var(--shadow)}
.muted{color:var(--ink-3);font-size:14px}
svg{display:block}

/* shell */
.app{max-width:680px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 14px) 16px calc(env(safe-area-inset-bottom) + 48px)}
.top{display:flex;align-items:center;gap:8px;margin-bottom:14px;min-height:46px}
.top h1{font-size:30px;font-weight:750;letter-spacing:-.02em;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.icon-btn{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;color:var(--ink-2);position:relative;flex:none}
.icon-btn svg{width:22px;height:22px}
.icon-btn .badge{position:absolute;top:4px;right:2px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--hi);color:var(--ink-2);font-size:11px;font-weight:650;display:grid;place-items:center}
.add-btn{height:42px;padding:0 16px 0 12px;border-radius:999px;background:var(--dawn);color:var(--dawn-ink);font-weight:650;display:flex;align-items:center;gap:6px;box-shadow:0 8px 22px var(--shadow);flex:none}
.add-btn svg{width:20px;height:20px}

.filter{display:flex;align-items:center;gap:10px;height:46px;padding:0 8px 0 14px;border-radius:var(--r-md);margin-bottom:16px}
.filter svg{width:18px;height:18px;color:var(--ink-3);flex:none}
.filter input{flex:1;min-width:0;height:100%;font-size:16px}
.filter input::placeholder{color:var(--ink-3)}
.filter .clear{width:32px;height:32px;border-radius:50%;color:var(--ink-3);font-size:20px;line-height:1}
body.v-detail .filter{display:none}

.banner{display:flex;align-items:center;gap:10px;padding:12px 12px 12px 16px;border-radius:var(--r-md);margin-bottom:16px;border-color:var(--dawn)}
.banner b{flex:1;font-weight:600;font-size:15px}
.banner .add-btn{height:36px;padding:0 14px}
.banner .x{width:32px;height:32px;color:var(--ink-3);font-size:20px}

/* pinned row */
.pins{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 14px;margin:0 -2px 6px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.pins::-webkit-scrollbar{display:none}
.pin{flex:none;max-width:200px;display:flex;align-items:center;gap:8px;height:46px;padding:0 16px 0 8px;border-radius:999px;font-weight:600;font-size:15px;
  -webkit-touch-callout:none;user-select:none;-webkit-user-select:none}
.pin span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pin .kic{width:30px;height:30px}


/* groups */
.secs,.subs{display:grid;gap:14px}
.subs{gap:10px;padding:4px 10px 6px 14px}
.subs:empty{display:none}
.sec{--c:var(--ink-3);border-radius:var(--r-lg);padding:4px 0 8px}
.sec.sub{background:var(--field);border:1px solid var(--line);border-radius:var(--r-md);box-shadow:none;padding:2px 0 6px}
.sec-h{display:flex;align-items:center;gap:4px;padding:6px 6px 4px 2px}
.grip{width:32px;height:40px;display:grid;place-items:center;color:var(--ink-3);touch-action:none;cursor:grab;flex:none}
.grip svg{width:18px;height:18px}
.gicon{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;font-size:18px;flex:none;
  background:color-mix(in srgb,var(--c) 22%,transparent);color:var(--c)}
.gicon svg{width:18px;height:18px}
.sub .gicon{width:28px;height:28px;border-radius:9px;font-size:15px}
.sec-name{flex:1;min-width:0;display:flex;align-items:center;gap:8px;height:40px;text-align:left;font-size:18px;font-weight:700;padding-left:4px}
.sub .sec-name{font-size:16px;font-weight:650}
.sec-name span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sec-name small{font-size:12px;font-weight:700;color:var(--ink-2);background:var(--hi);border-radius:999px;padding:2px 8px;flex:none}
.sec-name .chev{width:16px;height:16px;color:var(--ink-3);transition:transform .25s;flex:none}
.sec.closed > .sec-h .chev{transform:rotate(-90deg)}
.sec.closed > .chat-list,.sec.closed > .subs{display:none}
.more,.proj-btn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:var(--ink-3);flex:none}
.more svg,.proj-btn svg{width:20px;height:20px}
.proj-btn{color:var(--c)}

/* item cards */
.chat-list{display:grid;gap:8px;padding:4px 10px 6px;min-height:8px}
.chat-list.bare:empty{min-height:54px;margin:2px 10px 6px;padding:0;border:1.5px dashed var(--line);border-radius:var(--r-sm)}
.chat-list.bare:empty::before{content:'Drag items here';display:grid;place-items:center;height:50px;color:var(--ink-3);font-size:14px}
.chat{--c:var(--dawn);display:flex;align-items:stretch;border-radius:14px;overflow:hidden;
  background:linear-gradient(90deg,color-mix(in srgb,var(--c) 14%,transparent),var(--field) 55%);
  border:1px solid color-mix(in srgb,var(--c) 30%,var(--line));
  box-shadow:inset 3px 0 0 var(--c),0 4px 14px var(--shadow);
  -webkit-touch-callout:none;user-select:none;-webkit-user-select:none;transition:transform .15s}
.chat:active{transform:scale(.985)}
.chat-main{flex:1;min-width:0;display:flex;align-items:center;gap:12px;min-height:60px;padding:9px 6px 9px 14px;text-align:left}
.kic{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;flex:none;
  background:color-mix(in srgb,var(--c) 22%,transparent);color:var(--c)}
.kic svg{width:18px;height:18px}
.txt{min-width:0;flex:1}
.txt b{display:block;font-weight:620;font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.txt small{display:block;color:var(--ink-3);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:1px}
.txt small em{font-style:normal;color:var(--ink-2)}
.pinmark{width:7px;height:7px;border-radius:50%;background:var(--dawn);display:inline-block;margin-left:6px;vertical-align:middle}
.go{width:52px;display:grid;place-items:center;flex:none;color:var(--c);border-left:1px solid var(--line)}
.go span{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:color-mix(in srgb,var(--c) 20%,transparent)}
.go svg{width:18px;height:18px}
.go.none{color:var(--ink-3)}
.go.none span{background:var(--field)}
.new-sec{width:100%;height:50px;margin-top:14px;border-radius:var(--r-lg);border:1.5px dashed var(--line);color:var(--ink-2);font-weight:600}

/* drag feedback */
.s-ghost{opacity:.3}
.sortable-fallback{opacity:1!important;border-radius:14px;box-shadow:0 18px 40px var(--shadow)!important;scale:1.03;transition:scale .2s,opacity .2s}
body.hot-archive .sortable-fallback{scale:.55;opacity:.55!important}
/* card grip, same feel as groups */
.chat .grip{width:28px;height:auto;align-self:stretch;margin-left:3px}
.chat .chat-main{padding-left:2px}
/* archive dock */
.dock{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 22px);z-index:65;display:flex;align-items:center;gap:12px;
  padding:12px 22px 12px 14px;border-radius:999px;background:var(--sheet);border:1px solid var(--line);
  -webkit-backdrop-filter:blur(24px);backdrop-filter:blur(24px);box-shadow:0 16px 40px var(--shadow);
  transform:translate(-50%,160%);opacity:0;pointer-events:none;font-weight:650;white-space:nowrap;
  transition:transform .4s cubic-bezier(.34,1.4,.5,1),opacity .25s,background .2s,border-color .2s}
body.dragging .dock,body.archiving .dock{transform:translate(-50%,0);opacity:1}
.dock.hot{transform:translate(-50%,0) scale(1.14);background:color-mix(in srgb,var(--dawn) 26%,var(--sheet));border-color:var(--dawn)}
.bin{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--hi);color:var(--dawn)}
.bin svg{width:26px;height:26px;overflow:visible}
.bin .lid{transform-box:fill-box;transform-origin:0% 100%;transition:transform .35s cubic-bezier(.34,1.8,.5,1)}
.dock.hot .lid{transform:rotate(-32deg) translate(-1px,-3px)}
.dock .t2{display:none}
.dock.hot .t1{display:none}.dock.hot .t2{display:inline}
.dock.gulp .bin{animation:gulp .6s cubic-bezier(.34,1.6,.5,1)}
@keyframes gulp{0%{transform:scale(1)}25%{transform:scale(.72) rotate(-6deg)}60%{transform:scale(1.18) rotate(4deg)}100%{transform:scale(1)}}
.icon-btn.bump svg{animation:bump .6s cubic-bezier(.34,1.6,.5,1)}
.icon-btn.bump .badge{animation:pop .5s .15s both}
@keyframes bump{0%{transform:none}30%{transform:translateY(3px) scale(.85)}65%{transform:translateY(-3px) scale(1.12)}100%{transform:none}}
@keyframes pop{0%{transform:scale(.4)}70%{transform:scale(1.25)}100%{transform:scale(1)}}
.arch-h{font-size:13px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-3);margin:6px 4px 8px}
.arch-row .gicon{--c:var(--ink-3)}
body.dragging{user-select:none;-webkit-user-select:none}
.drop-hint{position:fixed;inset:12px;border:2px dashed var(--dawn);border-radius:28px;display:grid;place-items:center;z-index:70;
  background:color-mix(in srgb,var(--night) 70%,transparent);font-size:20px;font-weight:650;pointer-events:none}

/* flat lists */
.flat{border-radius:var(--r-lg);padding:10px;display:grid;gap:8px}
.arch-row{display:flex;align-items:center;gap:6px;padding:8px 4px 8px 10px}
.arch-row + .arch-row{box-shadow:inset 0 1px 0 var(--line)}
.arch-row > button:first-child{flex:1;min-width:0;text-align:left}
.arch-row b{display:block;font-weight:560;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pill-btn{height:34px;padding:0 12px;border-radius:999px;background:var(--field);font-size:14px;font-weight:600;color:var(--ink);flex:none}
.pill-btn.warn{color:var(--danger)}
.empty{border-radius:var(--r-lg);padding:26px 22px;text-align:center;display:grid;gap:12px;justify-items:center}
.empty h2{font-size:19px}
.empty p{color:var(--ink-2);max-width:34ch}

/* detail page */
.hero{--c:var(--dawn);border-radius:var(--r-lg);padding:18px;margin-bottom:14px;position:relative;overflow:hidden}
.hero::before{content:'';position:absolute;inset:0;background:radial-gradient(90% 80% at 0% 0%,color-mix(in srgb,var(--c) 22%,transparent),transparent 70%);pointer-events:none}
.hero > *{position:relative}
.crumbs{display:flex;align-items:center;gap:8px;flex-wrap:wrap;color:var(--ink-2);font-size:13px;font-weight:600;margin-bottom:10px}
.tag{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 10px;border-radius:999px;background:color-mix(in srgb,var(--c) 20%,transparent);color:var(--c)}
.tag svg{width:14px;height:14px}
.title-inp{width:100%;font-size:26px;font-weight:750;letter-spacing:-.02em;padding:4px 0;border-bottom:1px solid transparent}
.title-inp:focus{border-bottom-color:var(--line)}
.open-big{display:flex;align-items:center;justify-content:center;gap:10px;height:56px;border-radius:var(--r-md);background:var(--c);color:#111;font-weight:700;font-size:17px;margin-top:14px;box-shadow:0 10px 26px var(--shadow)}
.open-big svg{width:20px;height:20px}
.open-big.none{background:var(--field);color:var(--ink-2);box-shadow:none}
.hero-actions{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.card{border-radius:var(--r-lg);padding:16px;margin-bottom:14px}
.card-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.card-h h3{font-size:15px;font-weight:700;letter-spacing:.02em;text-transform:uppercase;color:var(--ink-2)}
.saved{font-size:12px;color:var(--ok);opacity:0;transition:opacity .3s}
.saved.on{opacity:1}
.todo{display:flex;align-items:center;gap:10px;min-height:44px}
.todo + .todo{box-shadow:inset 0 1px 0 var(--line)}
.tick{width:26px;height:26px;border-radius:50%;border:2px solid var(--ink-3);display:grid;place-items:center;flex:none;color:transparent}
.tick svg{width:14px;height:14px}
.todo.done .tick{background:var(--ok);border-color:var(--ok);color:#06220f}
.todo input{flex:1;min-width:0;height:42px;font-size:16px}
.todo.done input{color:var(--ink-3);text-decoration:line-through}
.todo .x{width:32px;height:32px;color:var(--ink-3);font-size:20px;flex:none}
.todo-new{display:flex;align-items:center;gap:10px;min-height:46px;box-shadow:inset 0 1px 0 var(--line)}
.todo-new .tick{border-style:dashed}
.todo-new input{flex:1;height:44px;font-size:16px}
.todo-new input::placeholder,.notes::placeholder{color:var(--ink-3)}
.notes{width:100%;min-height:140px;resize:none;font-size:16px;line-height:1.5;background:var(--field);border:1px solid var(--line);border-radius:var(--r-sm);padding:12px 14px}
.rows{display:grid}
.rowb{display:flex;align-items:center;gap:12px;min-height:52px;text-align:left;width:100%}
.rowb + .rowb,.rowb + .switch,.switch + .rowb{box-shadow:inset 0 1px 0 var(--line)}
.rowb span{flex:1;font-weight:560}
.rowb em{font-style:normal;color:var(--ink-2);max-width:55%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rowb.warn span{color:var(--danger)}
.meta{color:var(--ink-3);font-size:13px;text-align:center;margin-top:6px}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.4);opacity:0;pointer-events:none;transition:opacity .3s;z-index:40}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;max-width:680px;margin:0 auto;max-height:90vh;overflow:auto;z-index:41;
  padding:10px 20px calc(env(safe-area-inset-bottom) + 24px);border-radius:26px 26px 0 0;
  background:var(--sheet);-webkit-backdrop-filter:blur(26px) saturate(1.4);backdrop-filter:blur(26px) saturate(1.4);
  border:1px solid var(--line);border-bottom:0;
  transform:translateY(105%);transition:transform .42s cubic-bezier(.2,.9,.2,1.02)}
.sheet:not(.on){visibility:hidden;transition:transform .42s cubic-bezier(.2,.9,.2,1.02),visibility 0s .42s}
.sheet.on{transform:none}
.grab{width:40px;height:5px;border-radius:3px;background:var(--ink-3);margin:0 auto 14px;opacity:.6}
.sheet h2{font-size:22px;font-weight:720;letter-spacing:-.01em;margin-bottom:14px}
.field{display:grid;gap:6px;margin-bottom:16px}
.field > span{font-size:13px;color:var(--ink-3);font-weight:600}
.inp{width:100%;min-height:48px;padding:12px 14px;border-radius:var(--r-sm);background:var(--field);border:1px solid var(--line);font-size:16px}
.inp::placeholder{color:var(--ink-3)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{height:38px;padding:0 14px;border-radius:999px;background:var(--field);border:1px solid var(--line);color:var(--ink-2);font-weight:600;font-size:15px;display:inline-flex;align-items:center;gap:6px}
.chip svg{width:16px;height:16px}
.chip.on{background:var(--dawn);border-color:var(--dawn);color:var(--dawn-ink)}
.picker{display:grid;gap:4px;max-height:260px;overflow:auto;background:var(--field);border:1px solid var(--line);border-radius:var(--r-sm);padding:6px}
.pick{display:flex;align-items:center;gap:8px;min-height:42px;padding:0 10px;border-radius:10px;text-align:left;font-weight:560;color:var(--ink-2)}
.pick .gicon{width:26px;height:26px;border-radius:8px;font-size:14px}
.pick.on{background:var(--dawn);color:var(--dawn-ink)}
.pick.on .gicon{background:rgba(0,0,0,.12);color:inherit}
.swatches{display:flex;flex-wrap:wrap;gap:10px}
.sw{width:38px;height:38px;border-radius:50%;background:var(--c);border:3px solid transparent;box-shadow:0 0 0 1px var(--line)}
.sw.none{background:var(--field);display:grid;place-items:center;color:var(--ink-3);font-size:18px}
.sw.on{border-color:var(--ink)}
.emojis{display:grid;grid-template-columns:repeat(auto-fill,minmax(44px,1fr));gap:6px}
.emo{height:44px;border-radius:12px;background:var(--field);font-size:22px;border:2px solid transparent}
.emo.on{border-color:var(--dawn)}
.btn{width:100%;height:52px;border-radius:var(--r-md);background:var(--dawn);color:var(--dawn-ink);font-weight:680;font-size:16px;margin-top:6px;display:flex;align-items:center;justify-content:center;gap:8px}
.btn.ghost{background:var(--field);color:var(--ink)}
.btn.warn{background:var(--field);color:var(--danger)}
.btn:disabled{opacity:.5}
.btn + .btn{margin-top:10px}
.btn svg{width:20px;height:20px;flex:none}
.paste{height:76px;font-size:19px}
.paste svg{width:24px;height:24px}
.or{text-align:center;color:var(--ink-3);font-size:13px;margin:14px 0 10px}
.err{color:var(--danger);font-size:14px;margin:8px 2px 0;min-height:1em}
.linklike{display:block;margin:16px auto 0;color:var(--ink-2);font-weight:600;font-size:15px;text-decoration:underline;text-underline-offset:3px}
.switch{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:52px;font-weight:560}
.switch input{appearance:none;-webkit-appearance:none;width:50px;height:30px;border-radius:999px;background:var(--hi);position:relative;transition:background .2s;flex:none}
.switch input::after{content:'';position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:transform .25s cubic-bezier(.34,1.3,.5,1);box-shadow:0 2px 6px rgba(0,0,0,.25)}
.switch input:checked{background:var(--ok)}
.switch input:checked::after{transform:translateX(20px)}
.set{padding:4px 0 18px;border-bottom:1px solid var(--line);margin-bottom:18px}
.set h3{font-size:16px;font-weight:680;margin-bottom:4px}
.set .muted{margin-bottom:12px}
.theme-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.th{padding:12px 10px;border-radius:var(--r-md);border:1px solid var(--line);display:grid;gap:8px;justify-items:center;font-size:12px;color:var(--ink-2)}
.th .swt{width:100%;height:34px;border-radius:10px;position:relative;overflow:hidden}
.th .swt i{position:absolute;right:7px;top:7px;width:14px;height:14px;border-radius:50%}
.th.on{border-color:var(--dawn);color:var(--ink)}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);background:var(--field);border-radius:var(--r-sm);padding:4px;gap:4px}
.seg button{height:40px;border-radius:9px;font-size:14px;font-weight:600;color:var(--ink-2)}
.seg button.on{background:var(--hi);color:var(--ink)}
.dup{border-radius:var(--r-md);padding:16px;margin-bottom:14px}
.dup b{font-weight:650}

/* toast */
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 24px);transform:translate(-50%,16px);opacity:0;padding:11px 16px;border-radius:14px;
  background:var(--sheet);border:1px solid var(--line);font-size:15px;font-weight:560;z-index:60;transition:opacity .25s,transform .3s;pointer-events:none;max-width:88vw;text-align:center}

.login{min-height:80vh;display:grid;place-items:center}
.login form{width:100%;max-width:360px;border-radius:26px;padding:28px 22px;display:grid;gap:12px;text-align:center}
.login h1{font-size:32px;font-weight:760;letter-spacing:-.02em}
.login p{color:var(--ink-2);margin-bottom:6px}

/* colors (last so they win) */
.pick{--c:var(--ink-3)}
.pin{--c:var(--dawn)}
.rowb svg{width:20px;height:20px;color:var(--ink-3);flex:none}
.emo svg{width:20px;height:20px}
.pick > svg{width:18px;height:18px;flex:none}
.c-gold{--c:#f2c46d}.c-coral{--c:#ff8a65}.c-rose{--c:#f48fb1}.c-violet{--c:#b39ddb}

@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

  if (!iso) return '';
  const m = Math.round((Date.now() - new Date(iso)) / 6e4);
  if (m < 1) return 'just now';
  if (m < 60) return `${m}m ago`;
  const h = Math.round(m / 60);
  if (h < 24) return `${h}h ago`;

  return d < 30 ? `${d}d ago` : new Date(iso).toLocaleDateString(undefined, { month: 'short', day: 'numeric' });

// ---------- links ----------
const UUID_RE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i;

// Turns anything pasted into { kind, chat_uuid, url } or { error }.
function parseLink(text) {
  const t = String(text || '').trim().split(/\s+/)[0] || '';
  if (!t) return { error: 'Nothing to paste. Copy a link first.' };
  if (/claude\.ai\/share\//i.test(t)) return { error: "That's a share link, which is a public snapshot. Copy the chat's own link (claude.ai/chat/…) instead." };
  let m = t.match(new RegExp(`claude\\.ai/chat/(${U})`, 'i'));
  if (m) return { kind: 'chat', chat_uuid: m[1].toLowerCase(), url: null };
  if (UUID_RE.test(t)) return { kind: 'chat', chat_uuid: t.toLowerCase(), url: null };
  m = t.match(new RegExp(`claude\\.ai/project/(${U})`, 'i'));
  if (m) return { kind: 'project', chat_uuid: null, url: `https://claude.ai/project/${m[1].toLowerCase()}` };

    const url = t.replace(/^claude:\/\/claude\.ai\//i, 'https://claude.ai/').slice(0, 500);
    return { kind: /cowork/i.test(t) ? 'cowork' : 'other', chat_uuid: null, url };

const bySort = (k) => (a, b) => (a[k] ?? 0) - (b[k] ?? 0) || String(a.created_at || '').localeCompare(String(b.created_at || ''));
const secById = (id) => S.sections.find((s) => s.id === id);

// ---------- server ----------
async function api(path, opts = {}) {
  const res = await fetch(path, {
    method: opts.method || 'GET',
    headers: { 'Content-Type': 'application/json', ...(S.token ? { Authorization: 'Bearer ' + S.token } : {}) },
    body: opts.body ? JSON.stringify(opts.body) : undefined,
    keepalive: !!opts.keepalive,
  });
  let j = {};
  try { j = await res.json(); } catch {}
  if (res.status === 401 && path !== '/api/login') { signOut(j.error); throw new Error(j.error || 'Signed out.'); }
  if (!res.ok) throw new Error(j.error || `Request failed (${res.status}).`);
  return j;
}
async function load() {
  try {
    const j = await api('/api/data');
    S.sections = j.sections || []; S.chats = (j.chats || []).map((c) => ({ kind: 'chat', notes: '', todos: [], ...c }));
    S.settings = Object.fromEntries((j.settings || []).map((r) => [r.id, r.value]));
    S.loaded = true; saveCache();
    const t = S.settings.theme?.preset;
    if (t && THEMES[t] && t !== S.theme) applyTheme(t);
    if (S.view === 'detail') { renderTop(); return; } // don't clobber what you're typing
    renderContent(); renderTop();
  } catch (err) {
    if (S.token) toast(S.loaded ? 'Offline. Showing your saved list.' : err.message, true);
  }
}
let chain = Promise.resolve();
function push(ops) {
  saveCache();
  chain = chain.then(() => api('/api/data', { method: 'POST', body: { ops } }))
    .catch((err) => { toast(`Couldn't save. ${err.message}`, true); return load(); });
  return chain;
}
function renumber(list, key, extra = {}) {
  const changed = [];
  list.forEach((c, i) => {
    const diff = c[key] !== i || Object.entries(extra).some(([k, v]) => c[k] !== v);
    if (diff) { c[key] = i; Object.assign(c, extra); changed.push({ id: c.id, [key]: i, ...extra }); }
  });
  return changed;
}

  return bits.join(' · ');
}

// ---------- drag and drop ----------
function dragOpts(extra) {
  return {
    animation: 180, delay: 280, delayOnTouchOnly: true, touchStartThreshold: 8,
    forceFallback: true, fallbackOnBody: true, fallbackTolerance: 4, ghostClass: 's-ghost',
    onStart: () => { S.dragging = true; document.body.classList.add('dragging'); navigator.vibrate?.(10); },
    ...extra,

}
const endDrag = () => { document.body.classList.remove('dragging'); setTimeout(() => { S.dragging = false; }, 300); };
function initSortables() {
  if (!window.Sortable) return;
  $$('.chat-list').forEach((list) => sortables.push(Sortable.create(list, dragOpts({
    group: 'chats', draggable: '.chat', handle: '.cgrip', delay: 120,
    onEnd: (e) => { endDrag(); if (droppedOnArchive()) return archiveChat(e.item.dataset.id); if (e.from !== e.to || e.oldIndex !== e.newIndex) onChatDrop(e.from, e.to); },
  }))));

  $$('#secs, .subs').forEach((box) => sortables.push(Sortable.create(box, dragOpts({
    handle: '.grip', draggable: '.sec', delay: 120,
    onEnd: (e) => { endDrag(); if (droppedOnArchive()) return archiveGroup(e.item.dataset.sid); if (e.oldIndex !== e.newIndex) onSecDrop(box); },
  }))));
  const p = $('#pins');
  if (p) sortables.push(Sortable.create(p, dragOpts({
    draggable: '.pin', direction: 'horizontal',
    onEnd: (e) => { endDrag(); if (droppedOnArchive()) return archiveChat(e.item.dataset.id); if (e.oldIndex !== e.newIndex) onPinDrop(); },
  })));
}
// Archive box: shows up while dragging; drop on it to archive.
function trackArchive(e) {
  if (!S.dragging) return;
  const p = e.touches?.[0] || e;
  if (p.clientX == null) return;
  const r = $('#dock').getBoundingClientRect(), pad = 18;
  const over = p.clientX >= r.left - pad && p.clientX <= r.right + pad && p.clientY >= r.top - pad && p.clientY <= r.bottom + pad;
  if (over === !!S.overArchive) return;
  S.overArchive = over;
  $('#dock').classList.toggle('hot', over);
  document.body.classList.toggle('hot-archive', over);
  if (over) navigator.vibrate?.(8);
}
['pointermove', 'touchmove', 'mousemove'].forEach((t) => document.addEventListener(t, trackArchive, { capture: true, passive: true }));
function droppedOnArchive() {
  const hit = !!S.overArchive;
  S.overArchive = false;
  $('#dock').classList.remove('hot'); document.body.classList.remove('hot-archive');
  return hit;
}
function archiveFx() {
  const d = $('#dock');
  document.body.classList.add('archiving');
  d.classList.remove('gulp'); void d.offsetWidth; d.classList.add('gulp');
  clearTimeout(archiveFx.t);
  archiveFx.t = setTimeout(() => { document.body.classList.remove('archiving'); d.classList.remove('gulp'); }, 800);
  const b = $('[data-act="archive"]');
  if (b) { b.classList.remove('bump'); void b.offsetWidth; b.classList.add('bump'); }
}
function onChatDrop(from, to) {
  const rows = [];
  for (const list of new Set([from, to])) {
    const ordered = [...list.children].filter((r) => r.classList.contains('chat')).map((r) => chatById(r.dataset.id)).filter(Boolean);
    rows.push(...renumber(ordered, 'position', { section_id: list.dataset.sid }));

  renderContent();
  if (rows.length) push([{ op: 'patch', table: 'chats', rows }]);
}
function onSecDrop(box) {

  if (rows.length) push([{ op: 'patch', table: 'sections', rows }]);
}

// Autosave: typing waits a beat, taps save right away.
const timers = {};
function queueSave(id, fields, wait = 700) {

  const run = () => { delete timers[key]; push([{ op: 'patch', table: 'chats', rows: [{ id, ...fields }] }]); const s = $('#saved'); if (s) { s.classList.add('on'); setTimeout(() => s.classList.remove('on'), 1200); } };
  timers[key] = { run, t: setTimeout(run, wait) };

}

async function checkClipboard() {

  try { const p = await navigator.permissions.query({ name: 'clipboard-read' }); if (p.state !== 'granted') return; } catch { return; }
  try {
    const text = (await navigator.clipboard.readText()).trim();

}

    const text = ev.target.value.trim(), c = chatById(S.detailId);
    if (!text || !c) return;
    c.todos = [...(c.todos || []), { id: uid().slice(0, 8), text: text.slice(0, 300), done: false }];
    ev.target.value = ''; renderTodos(true); queueSave(c.id, { todos: c.todos }, 0);
  }
  if (id === 'd-name' || ev.target.classList.contains('todo-text')) { ev.preventDefault(); ev.target.blur(); }
  if (id === 'ac-name') { ev.preventDefault(); saveNew(); }
  if (id === 'g-name') { ev.preventDefault(); $('[data-act="g-save"]')?.click(); }
});
// Long-press is for dragging, so stop iOS link previews on cards.
document.addEventListener('contextmenu', (ev) => { if (ev.target.closest('.chat, .pin')) ev.preventDefault(); });
window.addEventListener('pagehide', flushSaves);

// ?add=<link> opens the add card (for a share-sheet Shortcut later)
function handleQuery() {
  const add = new URL(location.href).searchParams.get('add');
  if (!add || !S.token) return;
  history.replaceState(null, '', location.pathname);
  openAdd(add);
}

let lastLoad = Date.now();
document.addEventListener('visibilitychange', () => {
  if (document.hidden) return flushSaves();
  if (!S.token) return;
  setSky();
  if (Date.now() - lastLoad > 60e3) { lastLoad = Date.now(); load(); }
  checkClipboard();
});
window.addEventListener('focus', checkClipboard);

// ---------- boot ----------
applyTheme(S.theme);
if (S.token) loadCache();
render();
if (S.token) { load().then(checkClipboard); handleQuery(); }
</script>
</body>
</html>
